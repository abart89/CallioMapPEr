[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calliomapper"
version = "0.0.1"
description = "Transforms Calliope v0.7 energy models into linked-data knowledge graphs using the Open Energy Ontology."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "calliope>=0.7.0.dev1",
    "rdflib>=7.0",
    "linkml>=1.7",
    "linkml-runtime>=1.7",
    "pyshacl>=0.25",
    "pydantic>=2.0",
    "xarray",
    "netCDF4",
    "pyyaml",
]

[project.scripts]
calliomapper = "calliomapper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["calliomapper*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::Warning:requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "owlready2>=0.40",
]
