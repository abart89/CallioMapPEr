[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "calliomapper"
version = "0.0.1"
description = "Transforms Calliope v0.7 energy models into linked-data knowledge graphs using the Open Energy Ontology."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "calliope>=0.7",
    "rdflib>=7.0",
    "linkml>=1.7",
    "linkml-runtime>=1.7",
    "pyshacl>=0.25",
    "pydantic>=2.0",
    "xarray",
    "netCDF4",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
