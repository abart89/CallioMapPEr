id: https://w3id.org/ontocal
name: ontocal
description: An ontology extension mapping Calliope v0.7 to BFO and OEO.

imports:
  - linkml:types  # Required: makes built-in datatypes (string, float, uri, ...) available


# 1. PREFIXES: This maps your shorthand namespaces to actual web URIs.
prefixes:
  linkml: https://w3id.org/linkml/
  ontocal: https://w3id.org/ontocal/
  oeo: http://openenergy-platform.org/ontology/oeo/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  ro: http://purl.obolibrary.org/obo/RO_
default_prefix: ontocal


# 2. SLOTS (Attributes): Here you define your properties globally.
# You define them once here, and then "use" them inside your classes.
slots:
  has_part:
    slot_uri: bfo:0000051
    description: "Links a whole to its parts."

  part_of:
    slot_uri: bfo:0000050
    description: "Links a part to its whole."

  link_from:
    slot_uri: ontocal:linkFrom
    description: "The node from which a transmission technology originates."

  link_to:
    slot_uri: ontocal:linkTo
    description: "The node to which a transmission technology connects."

  carrier_in:
    slot_uri: ontocal:carrierIn
    description: "The energy carrier consumed as input by a technology."

  carrier_out:
    slot_uri: ontocal:carrierOut
    description: "The energy carrier produced as output by a technology."

  is_about:
    slot_uri: iao:0000136
    description: "Relates an information artifact to the entity it is about."

  applies_to_time:
    is_a: is_about          # sub-property of iao:is_about
    slot_uri: ontocal:appliesToTime
    description: "Links an Information Content Entity to the temporal region it describes. Accepts granular timesteps or macro horizons."
    range: OneDimensionalTemporalRegion

  unit:
    slot_uri: ontocal:unit
    range: string
    required: false
    description: "Unit of measure for the parameter value (e.g. 'fraction', 'year', 'kW'). Optional metadata hook — not semantically validated beyond equals_string constraints on specific parameter classes."

  source_reference:
    slot_uri: ontocal:sourceReference
    range: string
    required: false
    description: "Provenance string identifying the origin of the parameter value (e.g. 'User CSV Upload', 'base_config.yaml')."

  aggregation_type:
    slot_uri: ontocal:aggregationType
    range: AggregationTypeEnum
    required: false
    description: "Specifies the statistical aggregation method used for a parameter representing a macro-summary."

  temporal_part_of:
    slot_uri: bfo:0000139
    description: "A mereological relation linking a temporal proper part to its temporal whole."

  output_of:
    slot_uri: ro:0002353
    description: "The BFO/OBO standard relation for inverse of has output. Links a continuant (such as output data) to the occurrent process that generated it."

  at_node:
    slot_uri: ontocal:atNode
    range: CalliopeNetworkNode
    required: false
    description: "The network node at which a variable is localised. Optional at the base level; required by most tech-scoped variable classes."

  for_carrier:
    slot_uri: ontocal:forCarrier
    range: CalliopeEnergyCarrier
    required: false
    description: "The energy carrier this variable is indexed by. Used for carrier-scoped and balancing variables."

# 3. CLASSES (Taxonomy): This is where you build your hierarchy.
classes:
  # --- OEO Stub Classes ---
  # External OEO classes referenced as parents. class_uri pins them to the real OEO IRI.
  # No body beyond class_uri — these are anchors, not local definitions.
  SoftwareFramework:
    class_uri: oeo:OEO_00000382
    description: "OEO class for software frameworks."

  EnergySystemModel:
    class_uri: oeo:OEO_00000339
    description: "OEO class for energy system models."

  ModelComponent:
    class_uri: oeo:OEO_00000340
    description: "OEO class for model building blocks."

  Optimisation:
    class_uri: oeo:OEO_00000313
    description: "OEO class for the core solver/optimisation process."
    # slot_usage for part_of (→ CalliopeScenario) will be added once that class is defined.

  Scenario:
    class_uri: oeo:OEO_00000364
    description: "OEO class for scenarios."

  DataSet:
    class_uri: iao:IAO_0000100
    description: "IAO class for a data set."

  ExogenousData:
    class_uri: oeo:OEO_00030029
    description: "OEO class for exogenous data (input parameters defined outside the model)."

  EndogenousData:
    class_uri: oeo:OEO_00030030
    description: "OEO class for endogenous data (data determined within the model)."

  OutputData:
    is_a: EndogenousData
    class_uri: oeo:OEO_00020013
    description: "OEO class for output data determined by a model calculation."

  OneDimensionalTemporalRegion:
    class_uri: bfo:0000038
    description: "BFO stub: a one-dimensional temporal region. Parent of all temporal classes in this schema."

  TimeStep:
    is_a: OneDimensionalTemporalRegion
    class_uri: oeo:OEO_00030033
    description: "OEO class for a discrete timestep in a model simulation."


  CalliopeDataHorizon:
    is_a: OneDimensionalTemporalRegion
    class_uri: bfo:0000038
    description: "A one-dimensional temporal region representing the maximal dataset boundaries defined at the base Calliope model level."

  CalliopeExecutionHorizon:
    is_a: OneDimensionalTemporalRegion
    class_uri: bfo:0000038
    description: "A one-dimensional temporal region representing the specific sliced subset simulated by a Calliope scenario."
    slots:
      - temporal_part_of
    slot_usage:
      temporal_part_of:
        range: CalliopeDataHorizon
        required: true


  # --- Calliope Extensions (ontocal) ---
  CalliopeOptimisationRun:
    is_a: Optimisation
    description: "A single execution of the Calliope solver against a fully parametrised model."

  CalliopeResultDataset:
    is_a: DataSet
    description: "The complete dataset containing all endogenous output variables generated by a Calliope optimisation process."
    slot_usage:
      output_of:
        range: CalliopeOptimisationRun
        required: true
      has_part:
        range: CalliopeVariable

  CalliopeVariable:
    is_a: OutputData
    description: "An output variable calculated by the Calliope solver during optimization."
    slots:
      - applies_to_time
      - unit
      - at_node       # optional: node at which the variable is localised
      - for_carrier   # optional: carrier the variable is indexed by
    slot_usage:
      part_of:
        range: CalliopeResultDataset
        required: true
      is_about:
        any_of:
          - range: ModelComponent
          - range: CalliopeModel
        required: true

  # --- Calliope Variable scoped intermediates ---
  TechVariable:
    is_a: CalliopeVariable
    description: "A model variable scoped to a specific technology (e.g. flow_cap, carrier_prod)."
    slot_usage:
      is_about:
        range: CalliopeTechnology
        required: true

  SupplyTechVariable:
    is_a: TechVariable
    description: "A model variable scoped to a supply technology."
    slot_usage:
      is_about:
        range: CalliopeSupplyTechnology
        required: true

  DemandTechVariable:
    is_a: TechVariable
    description: "A model variable scoped to a demand technology."
    slot_usage:
      is_about:
        range: CalliopeDemandTechnology
        required: true

  StorageTechVariable:
    is_a: TechVariable
    description: "A model variable scoped to a storage technology."
    slot_usage:
      is_about:
        range: CalliopeStorageTechnology
        required: true

  TransmissionTechVariable:
    is_a: TechVariable
    description: "A model variable scoped to a transmission technology."
    slot_usage:
      is_about:
        range: CalliopeTransmissionTechnology
        required: true

  ConversionTechVariable:
    is_a: TechVariable
    description: "A model variable scoped to a conversion technology."
    slot_usage:
      is_about:
        range: CalliopeConversionTechnology
        required: true

  NodeVariable:
    is_a: CalliopeVariable
    description: "A model variable scoped to a specific network node (e.g. node-level cost summaries)."
    slot_usage:
      is_about:
        range: CalliopeNetworkNode
        required: true

  SystemVariable:
    is_a: CalliopeVariable
    description: "A model variable representing a system-wide aggregate quantity (e.g. total system cost, total emissions)."
    slot_usage:
      is_about:
        range: CalliopeModel
        required: true

  CalliopeScenario:
    is_a: Scenario
    description: "A specific set of assumptions and parameters defining one Calliope model configuration."

  CalliopeModelParameter:
    is_a: ExogenousData
    description: "An input parameter supplied to a Calliope model from outside the optimisation (e.g. costs, capacities, time series)."
    slots:
      - applies_to_time   # optional: granular timestep or macro horizon
      - aggregation_type  # optional: only for parameters summarising over a macro horizon
      - unit              # optional: plain string, validated by equals_string on specific subclasses
      - source_reference  # optional: provenance string, free-form
    slot_usage:
      part_of:
        range: CalliopeScenario
      applies_to_time:
        range: OneDimensionalTemporalRegion
        required: false
      aggregation_type:
        required: false
      unit:
        required: false
      source_reference:
        required: false

  TechParameter:
    is_a: CalliopeModelParameter
    description: "A model parameter that applies to a specific technology."
    slot_usage:
      is_about:
        range: CalliopeTechnology
        required: true

  SupplyTechParameter:
    is_a: TechParameter
    description: "A model parameter scoped to a supply technology."
    slot_usage:
      is_about:
        range: CalliopeSupplyTechnology
        required: true

  DemandTechParameter:
    is_a: TechParameter
    description: "A model parameter scoped to a demand technology."
    slot_usage:
      is_about:
        range: CalliopeDemandTechnology
        required: true

  StorageTechParameter:
    is_a: TechParameter
    description: "A model parameter scoped to a storage technology."
    slot_usage:
      is_about:
        range: CalliopeStorageTechnology
        required: true

  TransmissionTechParameter:
    is_a: TechParameter
    description: "A model parameter scoped to a transmission technology."
    slot_usage:
      is_about:
        range: CalliopeTransmissionTechnology
        required: true

  ConversionTechParameter:
    is_a: TechParameter
    description: "A model parameter scoped to a conversion technology."
    slot_usage:
      is_about:
        range: CalliopeConversionTechnology
        required: true

  NodeParameter:
    is_a: CalliopeModelParameter
    description: "A model parameter that applies to a specific node."
    slot_usage:
      is_about:
        range: CalliopeNetworkNode
        required: true

  CalliopeModel:
    is_a: EnergySystemModel
    description: "The overarching informational representation of a Calliope v0.7 model."
    attributes:
      name:
        range: string
        description: "Human-readable name of the Calliope model."
    slot_usage:
      has_part:
        range: ModelComponent
        description: "Links the model to its internal informational building blocks (Nodes, Techs, Links)."


  CalliopeEnergyCarrier:
    is_a: ModelComponent
    description: "An energy carrier that can be used by technologies."
    attributes:
      name:
        range: string
        description: "Human-readable name of the energy carrier."

  CalliopeNetworkNode:
    is_a: ModelComponent
    description: "A spatial node in Calliope."
    attributes:
      name:
        range: string
        description: "Human-readable name of the node."
      latitude:
        range: float
        description: "WGS84 latitude of the node in decimal degrees."
      longitude:
        range: float
        description: "WGS84 longitude of the node in decimal degrees."
      has_assigned_technology:
        range: CalliopeTechnology
        multivalued: true
        description: >-
          Technologies located at this node. Covers Supply, Demand, Storage, and Conversion.
          Transmission technologies are excluded — their node assignment is handled via link_from/link_to.

  CalliopeTechnology:
    is_a: ModelComponent
    description: "Base class for Calliope technologies."
    attributes:
      name:
        range: string
        description: "Human-readable name of the technology."

  CalliopeSupplyTechnology:
    is_a: CalliopeTechnology
    description: "A technology that draws from a source to produce a carrier."
    slot_usage:
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeDemandTechnology:
    is_a: CalliopeTechnology
    description: "A technology that consumes a carrier for an external sink."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeStorageTechnology:
    is_a: CalliopeTechnology
    description: "A technology that stores a carrier."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeTransmissionTechnology:
    is_a: CalliopeTechnology
    description: "A technology that transmits a carrier between nodes."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true
      link_from:
        range: CalliopeNetworkNode
        required: true
      link_to:
        range: CalliopeNetworkNode
        required: true

  CalliopeConversionTechnology:
    is_a: CalliopeTechnology
    description: "A technology that converts between different carriers."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true


# 4. ENUMS
enums:
  AggregationTypeEnum:
    description: "The mathematical operation applied to aggregate granular occurrent data into a single scalar Information Content Entity over a macro temporal region."
    permissible_values:
      sum:
        description: "The cumulative total over the temporal region."
      average:
        description: "The arithmetic mean over the temporal region."
      max:
        description: "The peak value observed within the temporal region."
      min:
        description: "The lowest value observed within the temporal region."


# 5. INDIVIDUALS:
# LinkML 1.x does not support an 'individuals:' block in the schema — named individuals live in
# separate data files. The Calliope framework individual is declared in ontology/individuals.ttl
# as:  ontocal:Calliope  rdf:type  oeo:OEO_00000382 (SoftwareFramework) .
