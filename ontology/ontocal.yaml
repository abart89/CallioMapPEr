id: https://w3id.org/ontocal
name: ontocal
description: An ontology extension mapping Calliope v0.7 to BFO and OEO.

imports:
  - linkml:types  # Required: makes built-in datatypes (string, float, uri, ...) available


# 1. PREFIXES: This maps your shorthand namespaces to actual web URIs.
prefixes:
  linkml: https://w3id.org/linkml/
  ontocal: https://w3id.org/ontocal/
  oeo: http://openenergy-platform.org/ontology/oeo/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: ontocal


# 2. SLOTS (Attributes): Here you define your properties globally.
# You define them once here, and then "use" them inside your classes.
slots:
  has_part:
    slot_uri: bfo:0000051
    description: "Links a whole to its parts."

  part_of:
    slot_uri: bfo:0000050
    description: "Links a part to its whole."

  link_from:
    slot_uri: ontocal:linkFrom
    description: "The node from which a transmission technology originates."

  link_to:
    slot_uri: ontocal:linkTo
    description: "The node to which a transmission technology connects."

  carrier_in:
    slot_uri: ontocal:carrierIn
    description: "The energy carrier consumed as input by a technology."

  carrier_out:
    slot_uri: ontocal:carrierOut
    description: "The energy carrier produced as output by a technology."

  is_about:
    slot_uri: iao:0000136
    description: "Relates an information artifact to the entity it is about."


# 3. CLASSES (Taxonomy): This is where you build your hierarchy.
classes:
  # --- OEO Stub Classes ---
  # External OEO classes referenced as parents. class_uri pins them to the real OEO IRI.
  # No body beyond class_uri — these are anchors, not local definitions.
  SoftwareFramework:
    class_uri: oeo:OEO_00000382
    description: "OEO class for software frameworks."

  EnergySystemModel:
    class_uri: oeo:OEO_00000339
    description: "OEO class for energy system models."

  ModelComponent:
    class_uri: oeo:OEO_00000340
    description: "OEO class for model building blocks."

  Optimisation:
    class_uri: oeo:OEO_00000313
    description: "OEO class for the core solver/optimisation process."
    # slot_usage for part_of (→ CalliopeScenario) will be added once that class is defined.

  Scenario:
    class_uri: oeo:OEO_00000364
    description: "OEO class for scenarios."

  ExogenousData:
    class_uri: oeo:OEO_00030029
    description: "OEO class for exogenous data (input parameters defined outside the model)."


  # --- Calliope Extensions (ontocal) ---
  CalliopeOptimisationRun:
    is_a: Optimisation
    description: "A single execution of the Calliope solver against a fully parametrised model."

  CalliopeScenario:
    is_a: Scenario
    description: "A specific set of assumptions and parameters defining one Calliope model configuration."

  CalliopeModelParameter:
    is_a: ExogenousData
    description: "An input parameter supplied to a Calliope model from outside the optimisation (e.g. costs, capacities, time series)."
    slot_usage:
      part_of:
        range: CalliopeScenario

  TechParameter:
    is_a: CalliopeModelParameter
    description: "A model parameter that applies to a specific technology."
    slot_usage:
      is_about:
        range: CalliopeTechnology
        required: true

  NodeParameter:
    is_a: CalliopeModelParameter
    description: "A model parameter that applies to a specific node."
    slot_usage:
      is_about:
        range: CalliopeNetworkNode
        required: true

  CalliopeModel:
    is_a: EnergySystemModel
    description: "The overarching informational representation of a Calliope v0.7 model."
    attributes:
      name:
        range: string
        description: "Human-readable name of the Calliope model."
    slot_usage:
      has_part:
        range: ModelComponent
        description: "Links the model to its internal informational building blocks (Nodes, Techs, Links)."


  CalliopeEnergyCarrier:
    is_a: ModelComponent
    description: "An energy carrier that can be used by technologies."
    attributes:
      name:
        range: string
        description: "Human-readable name of the energy carrier."

  CalliopeNetworkNode:
    is_a: ModelComponent
    description: "A spatial node in Calliope."
    attributes:
      name:
        range: string
        description: "Human-readable name of the node."
      latitude:
        range: float
        description: "WGS84 latitude of the node in decimal degrees."
      longitude:
        range: float
        description: "WGS84 longitude of the node in decimal degrees."
      has_assigned_technology:
        range: CalliopeTechnology
        multivalued: true
        description: >-
          Technologies located at this node. Covers Supply, Demand, Storage, and Conversion.
          Transmission technologies are excluded — their node assignment is handled via link_from/link_to.

  CalliopeTechnology:
    is_a: ModelComponent
    description: "Base class for Calliope technologies."
    attributes:
      name:
        range: string
        description: "Human-readable name of the technology."

  CalliopeSupplyTechnology:
    is_a: CalliopeTechnology
    description: "A technology that draws from a source to produce a carrier."
    slot_usage:
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeDemandTechnology:
    is_a: CalliopeTechnology
    description: "A technology that consumes a carrier for an external sink."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeStorageTechnology:
    is_a: CalliopeTechnology
    description: "A technology that stores a carrier."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true

  CalliopeTransmissionTechnology:
    is_a: CalliopeTechnology
    description: "A technology that transmits a carrier between nodes."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true
      link_from:
        range: CalliopeNetworkNode
        required: true
      link_to:
        range: CalliopeNetworkNode
        required: true

  CalliopeConversionTechnology:
    is_a: CalliopeTechnology
    description: "A technology that converts between different carriers."
    slot_usage:
      carrier_in:
        range: CalliopeEnergyCarrier
        required: true
      carrier_out:
        range: CalliopeEnergyCarrier
        required: true


# 4. INDIVIDUALS:
# LinkML 1.x does not support an 'individuals:' block in the schema — named individuals live in
# separate data files. The Calliope framework individual is declared in ontology/individuals.ttl
# as:  ontocal:Calliope  rdf:type  oeo:OEO_00000382 (SoftwareFramework) .
