# CallioMapper — Structural Module (M1)
# LinkML schema: ontocal: classes and slots for Calliope model topology.
#
# STATUS: zero-shot draft — review OEO parent assignments before generating artifacts.
#
# Authoring guide:
#   - Add/rename classes under `classes:`
#   - `is_a:` = OEO or BFO parent class (use prefix notation: oeo:ClassName)
#   - `slots:` per class = parameters from parameter_catalog.yaml that belong to this class
#   - `oeo_notes:` = informal alignment notes, not parsed by LinkML (use comments)
#   - Run `make generate` once you are happy with a section to produce Pydantic + SHACL + TTL
#
# OEO parent candidates used here come from ontology_rationale.md.
# All are marked [REVIEW] where the OEO class URI still needs verification against oeo-full.yaml.

id: https://w3id.org/ontocal/structural
name: structural
description: >
  Structural module for CallioMapper. Defines ontocal: classes for Calliope v0.7
  model topology — the model run, spatial nodes, energy carriers, and technology archetypes.

prefixes:
  ontocal: https://w3id.org/ontocal/
  oeo: http://openenergy-platform.org/ontology/oeo/
  bfo: http://purl.obolibrary.org/obo/
  linkml: https://linkml.io/linkml-model/meta/
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#

default_prefix: ontocal
default_range: string

imports:
  - linkml:types

# ═══════════════════════════════════════════════════════════════
# CLASSES
# ═══════════════════════════════════════════════════════════════

classes:

  # ─────────────────────────────────────────────────────────────
  # Top-level model entity
  # ─────────────────────────────────────────────────────────────

  CalliopeModel:
    # OEO parent: oeo:EnergySystemModel [REVIEW: verify exact URI in oeo-full.yaml]
    is_a: oeo:EnergySystemModel
    description: >
      A single solved instance of a Calliope v0.7 energy system model.
      Represents one optimization run, identified by a unique run_id.
      All structural, provenance, and results named graphs are anchored to this entity.
    slots:
      - run_id
      - calliope_version
      - bigM
      - objective_cost_weights
      - min_cost_optimisation
    notes: >
      One CalliopeModel individual is minted per call to Translator.translate().
      Its URI serves as the base for all entity URIs in the run.

  # ─────────────────────────────────────────────────────────────
  # Topological elements
  # ─────────────────────────────────────────────────────────────

  CalliopeNode:
    # OEO parent: oeo:EnergySystem [REVIEW: may also fit oeo:PowerGridRegion or similar spatial class]
    is_a: oeo:EnergySystem
    description: >
      A spatial or system node in a Calliope model — a region, location, or aggregated
      area that hosts technologies and participates in carrier flows.
    slots:
      - latitude
      - longitude
    notes: >
      Corresponds to an entry under `nodes:` in the Calliope model definition.
      Node-technology assignments are expressed via ontocal:locatedAt on the technology side.

  EnergyCarrier:
    # OEO parent: oeo:EnergyCarrier (abstract) [REVIEW: check OEO carrier hierarchy]
    # NOTE: Calliope carriers are untyped string labels. We do NOT map them to OEO concrete
    # carrier classes (e.g. oeo:ElectricEnergy) — that would be fabrication.
    # Carriers are represented as EnergyCarrier individuals with rdfs:label only.
    # OEO concrete class alignment is an extension concern (physical system extension).
    is_a: oeo:EnergyCarrier
    description: >
      An energy carrier label used in a Calliope model (e.g. "power", "gas", "heat").
      Calliope carriers are untyped strings; no physical commodity mapping is inferred.
      Represented with rdfs:label only at the base layer.
    slots:
      - carrier_label
    notes: >
      Carrier individuals are minted from the unique carrier strings found in
      carrier_in / carrier_out across all technologies. URI: ontocal:{run_id}/carrier/{label}.

  # ─────────────────────────────────────────────────────────────
  # Technology hierarchy (abstract base)
  # ─────────────────────────────────────────────────────────────

  CalliopeTechnology:
    # OEO parent: [REVIEW — candidates: oeo:EnergyTransformationObject, oeo:PowerGeneratingUnit,
    # oeo:ModelComponent. Must be abstract enough to subsume all 5 archetypes.
    # oeo:EnergyTransformationObject is currently the working hypothesis.]
    abstract: true
    description: >
      Abstract base class for all Calliope technology archetypes. Not instantiated directly;
      use the five concrete subclasses below.
    slots:
      - tech_name
      - base_tech
      - lifetime
      - flow_cap_max
      - flow_cap_max_systemwide
      - flow_out_eff
      - flow_ramping
      - include_storage
      - cost_flow_cap
      - cost_flow_out
      - cost_interest_rate
      - locatedAt
    notes: >
      Slots listed here are inherited by all subclasses. Subclass-specific slots
      are listed under each subclass and are additive (not replacing).

  # ─────────────────────────────────────────────────────────────
  # Technology subclasses — one per Calliope base_tech value
  # ─────────────────────────────────────────────────────────────

  SupplyTechnology:
    # OEO parent (via CalliopeTechnology): supply-side generation or resource extraction unit.
    # Candidate: oeo:PowerGeneratingUnit for electricity; but Calliope supply is generic.
    # Working hypothesis: inherit from CalliopeTechnology → oeo:EnergyTransformationObject.
    is_a: CalliopeTechnology
    description: >
      A technology that introduces energy into the system from an external resource
      (e.g. wind, solar, gas turbine, nuclear). Corresponds to base_tech: supply.
    slots:
      - carrier_out
      - source_unit
      - source_use_max
      - source_cap
      - area_use_max
      - flow_out_parasitic_eff
      - cost_source_cap
      - cost_area_use
    notes: >
      If include_storage: true, the technology also has storage-like behaviour
      (e.g. CSP with thermal storage). Flag for composite class review.

  DemandTechnology:
    # OEO parent: oeo:EnergyConsumer [REVIEW]
    is_a: CalliopeTechnology
    description: >
      A technology that removes energy from the system to satisfy a demand profile
      (e.g. electricity demand, heat demand). Corresponds to base_tech: demand.
    slots:
      - carrier_in
      - sink_use_equals
      - cost_flow_in
    notes: >
      sink_use_equals is the primary time-varying input for demand technologies.
      It defines the mandatory consumption profile the optimizer must satisfy.

  StorageTechnology:
    # OEO parent: oeo:EnergyStorageObject [REVIEW]
    is_a: CalliopeTechnology
    description: >
      A technology that stores energy across timesteps (e.g. battery, pumped hydro,
      hydrogen tank). Corresponds to base_tech: storage.
    slots:
      - carrier_in
      - carrier_out
      - flow_in_eff
      - storage_cap_max
      - flow_cap_per_storage_cap_max
      - storage_loss
      - cost_storage_cap
      - cost_flow_in
    notes: >
      Round-trip efficiency = flow_in_eff × flow_out_eff.
      storage_loss represents self-discharge per timestep.

  TransmissionTechnology:
    # OEO parent: oeo:PowerLine or oeo:EnergyTransmissionLine [REVIEW]
    is_a: CalliopeTechnology
    description: >
      A technology that transfers energy between two nodes with optional losses
      (e.g. power line, pipeline, heat network). Corresponds to base_tech: transmission.
    slots:
      - carrier_in
      - carrier_out
      - linkFrom
      - linkTo
      - distance
    notes: >
      Transmission technologies are bidirectional in Calliope. Each direction has the
      same efficiency (flow_out_eff inherited from CalliopeTechnology).
      linkFrom / linkTo reference CalliopeNode individuals.

  ConversionTechnology:
    # OEO parent: oeo:EnergyTransformationObject [REVIEW — same as base class candidate,
    # may need a more specific OEO class for conversion specifically]
    is_a: CalliopeTechnology
    description: >
      A technology that converts one energy carrier to another (e.g. CHP, heat pump,
      electrolysis). Corresponds to base_tech: conversion.
    slots:
      - carrier_in
      - carrier_out
      - flow_in_eff
      - cost_flow_in
    notes: >
      carrier_in and carrier_out may each be lists for multi-input/multi-output conversion.
      definition_matrix is auto-generated by Calliope from these; skip in mapping.

# ═══════════════════════════════════════════════════════════════
# SLOTS
# ═══════════════════════════════════════════════════════════════
# Only slots that are used as class attributes above need to be declared here.
# Full parameter semantics (dims, applies_to, oeo_notes) are in parameter_catalog.yaml.

slots:

  # ── CalliopeModel slots ──────────────────────────────────────

  run_id:
    range: uriorcurie
    required: true
    description: Unique URI identifying this model run. Base for all entity URIs.

  calliope_version:
    range: string
    required: false
    description: Calliope version string (e.g. "0.7.0") from the model definition.

  bigM:
    range: float
    required: false
    description: >
      Large penalty cost for unmet demand / unused supply when feasibility constraints
      are enabled (ensure_feasibility: true).

  objective_cost_weights:
    range: float
    multivalued: true
    required: false
    description: Weights per cost class used in multi-objective optimization.

  min_cost_optimisation:
    range: float
    required: false
    description: Minimized objective function value (total system cost).

  # ── CalliopeNode slots ───────────────────────────────────────

  latitude:
    range: double
    required: false
    description: Geographic latitude (WGS84) of the node.

  longitude:
    range: double
    required: false
    description: Geographic longitude (WGS84) of the node.

  # ── EnergyCarrier slots ──────────────────────────────────────

  carrier_label:
    range: string
    required: true
    description: >
      The carrier string label as used in the Calliope model (e.g. "power", "gas").
      Mapped to rdfs:label on the EnergyCarrier individual.

  # ── CalliopeTechnology (shared) slots ────────────────────────

  tech_name:
    range: string
    required: false
    description: Human-readable technology name (from the `name:` field in techs.yaml).

  base_tech:
    range: string
    required: true
    description: >
      Calliope base technology type. Drives dispatch to the correct ontocal subclass.
      One of: supply, demand, storage, transmission, conversion.

  lifetime:
    range: integer
    required: false
    description: Expected operational lifespan in years; used to annualize investment costs.

  flow_cap_max:
    range: float
    required: false
    description: Maximum installed flow capacity at a node [kW].

  flow_cap_max_systemwide:
    range: float
    required: false
    description: Maximum total installed flow capacity across all nodes [kW].

  flow_out_eff:
    range: float
    required: false
    description: Output flow efficiency factor (0–1).

  flow_ramping:
    range: float
    required: false
    description: Maximum rate of change in output per timestep as fraction of flow capacity.

  include_storage:
    range: boolean
    required: false
    description: When true, adds intertemporal storage to a non-storage technology.

  cost_flow_cap:
    range: float
    required: false
    description: Capital cost per unit of installed flow capacity [currency/kW].

  cost_flow_out:
    range: float
    required: false
    description: Variable operational cost per unit of output [currency/kWh].

  cost_interest_rate:
    range: float
    required: false
    description: Discount rate for annualizing investment costs (dimensionless fraction).

  locatedAt:
    range: CalliopeNode
    required: false
    description: The node at which this technology is deployed.

  # ── SupplyTechnology slots ───────────────────────────────────

  carrier_out:
    range: EnergyCarrier
    required: true
    description: Output energy carrier produced by the technology.

  source_unit:
    range: string
    required: false
    description: Resource scaling unit. "per_area" = scales with deployed land area.

  source_use_max:
    range: float
    required: false
    multivalued: true
    description: Maximum resource consumption rate per timestep (timeseries).

  source_cap:
    range: float
    required: false
    description: Installed resource capacity [kW].

  area_use_max:
    range: float
    required: false
    description: Maximum land area that can be occupied [m²].

  flow_out_parasitic_eff:
    range: float
    required: false
    description: Auxiliary output efficiency loss after flow_out_eff (0–1).

  cost_source_cap:
    range: float
    required: false
    description: Capital cost per unit of source capacity [currency/kW].

  cost_area_use:
    range: float
    required: false
    description: Capital cost per unit of land area [currency/m²].

  # ── DemandTechnology slots ───────────────────────────────────

  carrier_in:
    range: EnergyCarrier
    required: true
    description: Input energy carrier consumed by the technology.

  sink_use_equals:
    range: float
    required: false
    multivalued: true
    description: Fixed demand profile that must be satisfied per timestep (timeseries).

  cost_flow_in:
    range: float
    required: false
    description: Variable operational cost per unit of input flow [currency/kWh].

  # ── StorageTechnology slots ──────────────────────────────────

  flow_in_eff:
    range: float
    required: false
    description: Input flow efficiency factor — charging losses (0–1).

  storage_cap_max:
    range: float
    required: false
    description: Maximum installed energy storage capacity [kWh].

  flow_cap_per_storage_cap_max:
    range: float
    required: false
    description: Upper bound on flow-to-storage capacity ratio (dimensionless).

  storage_loss:
    range: float
    required: false
    description: Fractional energy loss per timestep (self-discharge rate).

  cost_storage_cap:
    range: float
    required: false
    description: Capital cost per unit of storage capacity [currency/kWh].

  # ── TransmissionTechnology slots ─────────────────────────────

  linkFrom:
    range: CalliopeNode
    required: true
    description: Origin node of the transmission link.

  linkTo:
    range: CalliopeNode
    required: true
    description: Destination node of the transmission link.

  distance:
    range: float
    required: false
    description: Distance between the two endpoints [km].
