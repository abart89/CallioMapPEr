# Calliope v0.7 Parameter Catalog
#
# Intermediate artefact between raw Calliope data and the LinkML ontology schema.
# Each entry corresponds to one parameter (input or result variable).
#
# Fields:
#   kind         : input | result
#   dims         : index dimensions as produced by Calliope's results_directory CSV headers
#   range        : float | integer | string | boolean | structured
#   required     : true | false | auto (auto-generated by Calliope, not user-settable)
#   applies_to   : list of base_tech types [supply, demand, storage, transmission, conversion, all, node-level, global]
#   description  : short description from Calliope v0.7 docs
#   oeo_notes    : informal notes toward OEO/ontocal alignment (not yet formal OWL)
#
# Dimensions key:
#   nodes      : spatial/system nodes
#   techs      : technologies
#   carriers   : energy carriers
#   costs      : cost classes (e.g. monetary, emissions)
#   timesteps  : model timesteps
#
# Source: Calliope v0.7 docs + scripts/extract_param_dims.py on national_scale results_directory.

slots:

  # ─────────────────────────────────────────────
  # INPUTS — structural / identity
  # ─────────────────────────────────────────────

  base_tech:
    kind: input
    dims: [techs]
    range: string
    required: true
    applies_to: [all]
    description: >
      Fundamental technology classification that determines the role in the model.
      One of: supply, demand, storage, conversion, transmission.
    oeo_notesoeo_notes: >
      Maps directly to the ontocal class hierarchy:
      supply → ontocal:SupplyTechnology,
      demand → ontocal:DemandTechnology,
      storage → ontocal:StorageTechnology,
      transmission → ontocal:TransmissionTechnology,
      conversion → ontocal:ConversionTechnology.

  name:
    kind: input
    dims: [techs]
    range: string
    required: false
    applies_to: [all]
    description: Human-readable label for a technology.
    oeo_notesoeo_notes: "Map to rdfs:label on the technology individual."

  color:
    kind: input
    dims: [techs]
    range: string
    required: false
    applies_to: [all]
    description: Hexadecimal color code for visualization purposes. No semantic content.
    oeo_notesoeo_notes: Omit from ontology; visualization metadata only.

  carrier_in:
    kind: input
    dims: [nodes, techs, carriers]
    range: string
    required: true
    applies_to: [demand, storage, conversion, transmission]
    description: >
      Input carrier consumed by a technology. Can be a single carrier or a list
      for multi-input technologies.
    oeo_notesoeo_notes: >
      Generates ontocal:carrierIn triples linking the technology individual to an
      ontocal:EnergyCarrier individual. The carrier individual is identified by its label only
      (Calliope carriers are untyped strings).

  carrier_out:
    kind: input
    dims: [nodes, techs, carriers]
    range: string
    required: true
    applies_to: [supply, storage, conversion, transmission]
    description: >
      Output carrier produced by a technology. Can be a single carrier or a list
      for multi-output technologies.
    oeo_notesoeo_notes: >
      Generates ontocal:carrierOut triples. Same notes as carrier_in.

  definition_matrix:
    kind: input
    dims: [nodes, techs, carriers]
    range: structured
    required: auto
    applies_to: [all]
    description: >
      Auto-generated matrix encoding the input-output carrier relationships for each technology.
      Not user-settable; produced internally by Calliope before solving.
    oeo_notesoeo_notes: >
      Do not map as a standalone slot. Information is already captured via carrier_in / carrier_out.
      Skip in M1 structural mapping.

  include_storage:
    kind: input
    dims: [techs]
    range: boolean
    required: false
    applies_to: [supply, demand, conversion]
    description: >
      When true, adds intertemporal storage capability to a non-storage technology
      (e.g. CSP with thermal storage modelled as a supply technology).
    oeo_notesoeo_notes: >
      Affects ontocal class assignment: a supply technology with include_storage=true
      may warrant a composite class or annotation. Flag for review during structural.yaml authoring.

  source_unit:
    kind: input
    dims: [techs]
    range: string
    required: false
    applies_to: [supply]
    description: >
      Scaling unit for resource consumption. 'per_area' means resource availability
      scales with deployed land area.
    oeo_notesoeo_notes: "Candidate ontocal:sourceUnit literal. Affects how source_use_max values are interpreted."

  # ─────────────────────────────────────────────
  # INPUTS — node geographic
  # ─────────────────────────────────────────────

  latitude:
    kind: input
    dims: [nodes]
    range: float
    required: false
    applies_to: [node-level]
    description: >
      Geographic latitude coordinate (WGS84/EPSG4326) for a node.
      Used for distance calculations between transmission endpoints and visualization.
    oeo_notesoeo_notes: >
      Store as ontocal:latitude literal (xsd:double) on the ontocal:CalliopeNode individual.
      GeoSPARQL geometry representation is out of scope for launch.

  longitude:
    kind: input
    dims: [nodes]
    range: float
    required: false
    applies_to: [node-level]
    description: Geographic longitude coordinate (WGS84/EPSG4326) for a node.
    oeo_notesoeo_notes: "Store as ontocal:longitude literal (xsd:double). Same notes as latitude."

  # ─────────────────────────────────────────────
  # INPUTS — capacity and resource limits
  # ─────────────────────────────────────────────

  flow_cap_max:
    kind: input
    dims: [nodes, techs]
    range: float
    required: false
    applies_to: [all]
    description: >
      Maximum installed flow capacity for a technology at a node (default: unlimited).
      In operate mode this becomes the fixed installed capacity.
    oeo_notesoeo_notes: >
      Map as oeo:has_quantity_value literal with candidate unit oeo:kilowatt.
      Predicate: ontocal:flowCapMax.

  flow_cap_max_systemwide:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [all]
    description: >
      Maximum cumulative installed flow capacity for a technology summed across all nodes.
    oeo_notesoeo_notes: "Predicate: ontocal:flowCapMaxSystemwide. System-level constraint, not node-specific."

  flow_cap_per_storage_cap_max:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [storage]
    description: >
      Upper bound on the ratio of flow capacity to storage capacity
      (e.g. 4 means flow capacity ≤ 4 × storage capacity).
    oeo_notesoeo_notes: "Predicate: ontocal:flowCapPerStorageCapMax. Dimensionless ratio."

  storage_cap_max:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [storage]
    description: Maximum energy storage capacity that can be installed.
    oeo_notesoeo_notes: "Candidate unit: oeo:kilowatt_hour. Predicate: ontocal:storageCapMax."

  area_use_max:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [all]
    description: Maximum land area that a technology can occupy at a node.
    oeo_notesoeo_notes: "Candidate unit: oeo:square_metre. Predicate: ontocal:areaUseMax."

  source_use_max:
    kind: input
    dims: [timesteps, nodes, techs]
    range: float
    required: false
    applies_to: [supply]
    description: >
      Maximum rate of resource consumption per timestep. Typically a timeseries
      (e.g. hourly solar irradiance capacity factors).
    oeo_notesoeo_notes: >
      Time-varying input. Represented as sosa:Observation in M3 (symmetric with output results).
      Predicate: ontocal:sourceUseMax.

  sink_use_equals:
    kind: input
    dims: [timesteps, nodes, techs]
    range: float
    required: false
    applies_to: [demand]
    description: >
      Fixed demand that must be exactly satisfied by the technology at each timestep.
      Typically a timeseries (e.g. hourly electricity demand profile).
    oeo_notesoeo_notes: >
      Time-varying input. Represented as sosa:Observation in M3.
      Predicate: ontocal:sinkUseEquals.

  distance:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [transmission]
    description: >
      Distance between the two endpoints of a transmission link.
      Auto-calculated from node coordinates if not specified directly.
    oeo_notesoeo_notes: "Candidate unit: oeo:kilometre. Predicate: ontocal:distance."

  # ─────────────────────────────────────────────
  # INPUTS — efficiency parameters
  # ─────────────────────────────────────────────

  flow_out_eff:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [supply, storage, conversion, transmission]
    description: >
      Efficiency factor applied to output flow (0–1). Represents discharge efficiency,
      conversion efficiency, or transmission losses.
    oeo_notesoeo_notes: "Dimensionless ratio. Predicate: ontocal:flowOutEff."

  flow_in_eff:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [storage, conversion]
    description: >
      Efficiency factor applied to input flow (0–1). Represents charging losses
      or inlet conversion losses.
    oeo_notesoeo_notes: "Dimensionless ratio. Predicate: ontocal:flowInEff."

  flow_out_parasitic_eff:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [supply, storage, conversion]
    description: >
      Additional auxiliary efficiency loss on the output (0–1), applied after flow_out_eff.
      Used for parasitic consumption (e.g. CSP field self-consumption).
    oeo_notesoeo_notes: "Dimensionless ratio. Predicate: ontocal:flowOutParasiticEff."

  flow_ramping:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [all]
    description: >
      Maximum allowed rate of change in technology output between consecutive timesteps,
      as a fraction of flow capacity.
    oeo_notesoeo_notes: "Dimensionless. Predicate: ontocal:flowRamping."

  storage_loss:
    kind: input
    dims: [techs]
    range: float
    required: false
    applies_to: [storage]
    description: >
      Fractional energy loss per timestep for stored energy (self-discharge or decay).
      Exponentiated for inter-cluster storage in time-clustering mode.
    oeo_notesoeo_notes: "Dimensionless ratio per timestep. Predicate: ontocal:storageLoss."

  # ─────────────────────────────────────────────
  # INPUTS — lifetime
  # ─────────────────────────────────────────────

  lifetime:
    kind: input
    dims: [techs]
    range: integer
    required: false
    applies_to: [all]
    description: Expected operational lifespan in years; used to annualize investment costs.
    oeo_notesoeo_notes: "Candidate unit: oeo:year. Predicate: ontocal:lifetime."

  # ─────────────────────────────────────────────
  # INPUTS — cost parameters
  # ─────────────────────────────────────────────

  cost_flow_cap:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [all]
    description: Capital investment cost per unit of installed flow capacity.
    oeo_notesoeo_notes: >
      Indexed by cost class (e.g. monetary). Candidate unit: currency per kW.
      Predicate: ontocal:costFlowCap.

  cost_storage_cap:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [storage]
    description: Capital investment cost per unit of installed energy storage capacity.
    oeo_notesoeo_notes: "Candidate unit: currency per kWh. Predicate: ontocal:costStorageCap."

  cost_source_cap:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [supply]
    description: Capital investment cost per unit of source (resource) capacity.
    oeo_notesoeo_notes: "Candidate unit: currency per kW. Predicate: ontocal:costSourceCap."

  cost_area_use:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [all]
    description: Capital investment cost per unit of land area occupied.
    oeo_notesoeo_notes: "Candidate unit: currency per m². Predicate: ontocal:costAreaUse."

  cost_flow_out:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [supply, conversion, storage, transmission]
    description: Variable operational cost per unit of carrier output at each timestep.
    oeo_notesoeo_notes: "Candidate unit: currency per kWh. Predicate: ontocal:costFlowOut."

  cost_flow_in:
    kind: input
    dims: [costs, techs]
    range: float
    required: false
    applies_to: [demand, conversion, storage]
    description: Variable operational cost per unit of carrier input at each timestep.
    oeo_notesoeo_notes: "Candidate unit: currency per kWh. Predicate: ontocal:costFlowIn."

  cost_interest_rate:
    kind: input
    dims: [costs]
    range: float
    required: false
    applies_to: [global]
    description: >
      Discount/interest rate used to annualize investment costs over technology lifetime.
      Indexed by cost class.
    oeo_notesoeo_notes: "Dimensionless fraction. Predicate: ontocal:costInterestRate."

  # ─────────────────────────────────────────────
  # INPUTS — global / model-level
  # ─────────────────────────────────────────────

  bigM:
    kind: input
    dims: []
    range: float
    required: false
    applies_to: [global]
    description: >
      Large cost coefficient used when feasibility constraints are enabled; represents
      the penalty cost of unmet demand or unused supply. Scalar global parameter.
    oeo_notesoeo_notes: >
      Model-level parameter on the ontocal:CalliopeModel individual.
      Predicate: ontocal:bigM.

  objective_cost_weights:
    kind: input
    dims: [costs]
    range: float
    required: false
    applies_to: [global]
    description: >
      Relative weights applied to different cost classes in a multi-objective optimization
      (e.g. weight monetary costs vs emission costs).
    oeo_notesoeo_notes: >
      Model-level parameter on the ontocal:CalliopeModel individual.
      Predicate: ontocal:objectiveCostWeights.

  timestep_resolution:
    kind: input
    dims: [timesteps]
    range: float
    required: false
    applies_to: [global]
    description: >
      Real-world duration represented by each model timestep (e.g. 1.0 for hourly,
      6.0 for six-hourly). Used in energy balance equations and cost calculation.
    oeo_notesoeo_notes: >
      Global timeseries. Candidate unit: oeo:hour. Predicate: ontocal:timestepResolution.
      Not a technology parameter; attached to the model or run individual.

  timestep_weights:
    kind: input
    dims: [timesteps]
    range: float
    required: false
    applies_to: [global]
    description: >
      Relative importance weighting for each timestep in the objective function and
      levelized cost calculations. Used with time clustering (representative days).
    oeo_notesoeo_notes: >
      Dimensionless. Global timeseries. Predicate: ontocal:timestepWeights.
      Key for time-clustering scenarios: weights reflect how many real days each
      representative day stands for.

  # ─────────────────────────────────────────────
  # RESULTS — capacity
  # ─────────────────────────────────────────────

  flow_cap:
    kind: result
    dims: [nodes, techs, carriers]
    range: float
    required: false
    applies_to: [all]
    description: >
      Optimized installed flow capacity for a technology at a node and carrier.
      In operate mode this is an input (fixed capacity).
    oeo_notesoeo_notes: >
      Core M3 result. Emit as sosa:Observation on the technology-node pair.
      sosa:observedProperty: ontocal:flowCap.

  link_flow_cap:
    kind: result
    dims: [techs]
    range: float
    required: false
    applies_to: [transmission]
    description: Optimized installed capacity for a transmission link.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:linkFlowCap."

  storage_cap:
    kind: result
    dims: [nodes, techs]
    range: float
    required: false
    applies_to: [storage]
    description: Optimized energy storage capacity installed for a storage technology.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:storageCap."

  source_cap:
    kind: result
    dims: [nodes, techs]
    range: float
    required: false
    applies_to: [supply]
    description: Optimized resource capacity for supply technologies.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:sourceCap."

  area_use:
    kind: result
    dims: [nodes, techs]
    range: float
    required: false
    applies_to: [all]
    description: Optimized land area occupied by a technology at a node.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:areaUse."

  # ─────────────────────────────────────────────
  # RESULTS — flows (time-varying)
  # ─────────────────────────────────────────────

  flow_out:
    kind: result
    dims: [nodes, techs, carriers, timesteps]
    range: float
    required: false
    applies_to: [supply, storage, conversion, transmission]
    description: Output flow (production/discharge) of a carrier from a technology per timestep.
    oeo_notesoeo_notes: >
      Time-varying result. Deferred to full profile (per-timestep). For standard profile,
      use aggregate totals (e.g. sum over timesteps).

  flow_in:
    kind: result
    dims: [nodes, techs, carriers, timesteps]
    range: float
    required: false
    applies_to: [demand, storage, conversion, transmission]
    description: Input flow (consumption/charging) of a carrier by a technology per timestep.
    oeo_notesoeo_notes: Time-varying result. Same notes as flow_out.

  flow_out_inc_eff:
    kind: result
    dims: [nodes, techs, carriers, timesteps]
    range: float
    required: false
    applies_to: [supply, storage, conversion, transmission]
    description: >
      Output flow before efficiency deduction; represents gross production
      (flow_out / flow_out_eff).
    oeo_notesoeo_notes: Time-varying. Useful for efficiency loss attribution. Deferred to full profile.

  flow_in_inc_eff:
    kind: result
    dims: [nodes, techs, carriers, timesteps]
    range: float
    required: false
    applies_to: [demand, storage, conversion, transmission]
    description: >
      Input flow before efficiency deduction; represents gross resource consumption
      (flow_in / flow_in_eff).
    oeo_notesoeo_notes: Time-varying. Deferred to full profile.

  source_use:
    kind: result
    dims: [nodes, techs, timesteps]
    range: float
    required: false
    applies_to: [supply]
    description: Rate of resource consumption by a supply technology per timestep.
    oeo_notesoeo_notes: Time-varying. Deferred to full profile.

  storage:
    kind: result
    dims: [nodes, techs, timesteps]
    range: float
    required: false
    applies_to: [storage]
    description: Energy stored in a storage technology at each timestep (state-of-charge).
    oeo_notesoeo_notes: Time-varying. Deferred to full profile.

  # ─────────────────────────────────────────────
  # RESULTS — costs
  # ─────────────────────────────────────────────

  cost:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [all]
    description: Total optimization cost (investment + operational) per technology, node, and cost class.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:cost. Key aggregate for cross-run comparison."

  cost_investment:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [all]
    description: Total capital investment costs per technology, node, and cost class.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestment."

  cost_investment_annualised:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [all]
    description: >
      Investment costs annualized using the compound interest formula with lifetime
      and interest rate parameters.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestmentAnnualised."

  cost_investment_flow_cap:
    kind: result
    dims: [nodes, techs, carriers, costs]
    range: float
    required: false
    applies_to: [all]
    description: Investment cost component attributable to flow capacity installation.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestmentFlowCap."

  cost_investment_storage_cap:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [storage]
    description: Investment cost component attributable to storage capacity installation.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestmentStorageCap."

  cost_investment_source_cap:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [supply]
    description: Investment cost component attributable to source capacity.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestmentSourceCap."

  cost_investment_area_use:
    kind: result
    dims: [nodes, techs, costs]
    range: float
    required: false
    applies_to: [all]
    description: Investment cost component attributable to land area occupation.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:costInvestmentAreaUse."

  cost_operation_variable:
    kind: result
    dims: [nodes, techs, costs, timesteps]
    range: float
    required: false
    applies_to: [all]
    description: Variable operational costs per technology, node, and timestep.
    oeo_notesoeo_notes: Time-varying. Aggregate over timesteps for standard profile.

  # ─────────────────────────────────────────────
  # RESULTS — system metrics (post-processed)
  # ─────────────────────────────────────────────

  capacity_factor:
    kind: result
    dims: [nodes, techs, carriers, timesteps]
    range: float
    required: false
    applies_to: [all]
    description: >
      Ratio of actual output to maximum potential output per timestep
      (flow_out / (flow_cap × timestep_resolution)). Values 0–1.
    oeo_notesoeo_notes: >
      Time-varying post-processed result. Useful for resource quality characterization.
      Deferred to full profile for per-timestep version.

  systemwide_capacity_factor:
    kind: result
    dims: [techs, carriers]
    range: float
    required: false
    applies_to: [all]
    description: >
      Average capacity factor for a technology across all nodes and timesteps,
      weighted by timestep importance. Post-processed result.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:systemwideCapacityFactor. Standard profile aggregate."

  systemwide_levelised_cost:
    kind: result
    dims: [techs, costs, carriers]
    range: float
    required: false
    applies_to: [all]
    description: >
      Levelized cost of energy for a technology across the whole system:
      total cost / total weighted production. Post-processed result.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:systemwideLevelisedCost. Key economic metric."

  total_levelised_cost:
    kind: result
    dims: [costs, carriers]
    range: float
    required: false
    applies_to: [all]
    description: >
      System-wide levelized cost of energy aggregated across all technologies,
      per carrier and cost class. Post-processed result.
    oeo_notesoeo_notes: "sosa:observedProperty: ontocal:totalLevelisedCost."

  min_cost_optimisation:
    kind: result
    dims: []
    range: float
    required: false
    applies_to: [global]
    description: >
      Scalar value of the minimized objective function (total system cost).
      The primary output of the optimization.
    oeo_notesoeo_notes: "Attach to ontocal:CalliopeModel individual. Predicate: ontocal:minCostOptimisation."

  # ─────────────────────────────────────────────
  # RESULTS — feasibility slack variables
  # ─────────────────────────────────────────────

  unmet_demand:
    kind: result
    dims: [nodes, carriers, timesteps]
    range: float
    required: false
    applies_to: [demand]
    description: >
      Slack variable for unsatisfied demand when feasibility constraints are enabled
      (ensure_feasibility: true). Penalized via bigM in the objective.
    oeo_notesoeo_notes: >
      Only present when ensure_feasibility is enabled. Flag in catalog as conditional.
      Predicate: ontocal:unmetDemand. Time-varying; deferred to full profile for timestep detail.

  unused_supply:
    kind: result
    dims: [nodes, carriers, timesteps]
    range: float
    required: false
    applies_to: [supply]
    description: >
      Slack variable for excess supply that cannot be absorbed, when feasibility
      constraints are enabled. Penalized via bigM.
    oeo_notesoeo_notes: "Conditional (ensure_feasibility). Predicate: ontocal:unusedSupply."

  unmet_sum:
    kind: result
    dims: [nodes, carriers, timesteps]
    range: float
    required: false
    applies_to: [all]
    description: >
      Post-processed aggregate of unmet_demand and unused_supply into a single
      feasibility metric per node, carrier, and timestep.
    oeo_notesoeo_notes: "Conditional (ensure_feasibility). Predicate: ontocal:unmetSum."
