id: https://w3id.org/ontocal/dummy
name: dummy_schema
description: >-
  Placeholder LinkML schema for CallioMapper pipeline development.
  Contains a single class (CalliopeThing, subclass of BFO entity) used to
  exercise the full pipeline — LinkML → Pydantic → StructuralMapper →
  SHACL validation → .nq output — while the real calliope_oeo.yaml
  mapping is being curated.

prefixes:
  linkml:  https://linkml.io/linkml-model/meta/
  ontocal:  https://w3id.org/ontocal/
  obo:     http://purl.obolibrary.org/obo/
  rdfs:    http://www.w3.org/2000/01/rdf-schema#

imports:
  - linkml:types

default_prefix: ontocal
default_range: string

classes:

  BFOEntity:
    description: Top-level BFO class (entity, BFO_0000001). Mixin — do not instantiate directly.
    class_uri: obo:BFO_0000001
    mixin: true

  CalliopeThing:
    description: >-
      Placeholder superclass for all Calliope model entities.
      Every node and technology is typed as a CalliopeThing until
      finer-grained OEO classes are introduced in the real schema.
    class_uri: ontocal:CalliopeThing
    mixins:
      - BFOEntity
    slots:
      - id
      - label

slots:

  id:
    description: Unique URI identifier for this entity.
    identifier: true
    range: uriorcurie
    required: true

  label:
    description: Human-readable name for this entity.
    slot_uri: rdfs:label
    range: string
    required: false
