    description: Kerosene, also known as paraffin, lamp oil, and coal oil (an obsolete
      term), is a portion of matter consisting of combustible hydrocarbon liquid which
      is derived from petroleum. It is widely used as a fuel in industry as well as
      households. It is sometimes spelled kerosine in scientific and industrial usage.
      [...]  Kerosene is widely used to power jet engines of aircraft (jet fuel) and
      some rocket engines and is also commonly used as a cooking and lighting fuel
      and for fire toys such as poi. In parts of Asia, kerosene is sometimes used
      as fuel for small outboard motors or even motorcycles.
