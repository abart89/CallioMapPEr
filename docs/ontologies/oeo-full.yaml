    name: RO_0000052
    comments:
    - 'Note that this relation was previously called \"inheres in\", but was changed
      to be called \"characteristic of\" because BFO2 uses \"inheres in\" in a more
      restricted fashion. This relation differs from BFO2:inheres_in in two respects:
      (1) it does not impose a range constraint, and thus it allows qualities of processes,
      as well as of information entities, whereas BFO2 restricts inheres_in to only
      apply to independent continuants (2) it is declared functional, i.e. something
      can only be a characteristic of one thing.'
    is_a: RO_0002314
    slot_uri: obo:RO_0000052
    multivalued: true
