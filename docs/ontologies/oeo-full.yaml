  OEO_00000193:
    name: OEO_00000193
    comments:
    - "Das Schema der Energiebilanzen umfasst eine Matrix von 33 Spalten und 68 Zeilen\
      \ (einschließlich der Summenspalten und -zeilen). In der horizontalen Gliederung\
      \ (Spalten) werden die Energieträger ausgewiesen, die der energetischen und\
      \ nichtenergetischen Nutzung dienen. In der vertikalen Gliederung (Zeilen) werden\
      \ für die jeweiligen Energieträger Aufkommen, Umwandlung und Verwendung erfasst.\n\
      \nAls Energieträger werden alle Quellen oder Stoffe bezeichnet, in denen Energie\
      \ mechanisch, thermisch, chemisch oder physikalisch gespeichert ist. Fünf Kerngruppe\
      \ werden bei der Energiebilanz unterschieden:\n\n    Fossile Brennstoffe\n \
      \   Erneuerbare Energien\n    Strom\n    Kernbrennstoffe\n    Fernwärme\n\n\
      Bilanzebenen\nSchematische Darstellung des Bilanzraums der deutschen Arbeitsgemeinschaft\
      \ Energiebilanzen\nPrimär- und Endenergie sowie Umwandlungsverluste\n\nDie Abgrenzung\
      \ erfolgt in drei Bilanzbereichen:\n\n    die Primärenergiebilanz,\n    die\
      \ Umwandlungsbilanz und\n    der Endenergieverbrauch.\n\nIn der Primärenergiebilanz\
      \ werden die Energieträger mit ihrem Mengenaufkommen bei der Gewinnung und Anlieferung\
      \ nach folgenden Kriterien erfasst:\n\n    inländische Gewinnung von Energieträgern,\n\
      \    Außenhandel mit Energieträgern, unterteilt nach Einfuhr und Ausfuhr,\n\
      \    Hochseebunkerungen (Heizöl, Dieselkraftstoff und Schmierstoffe für die\
      \ nationale und internationale Seeschifffahrt in deutschen Häfen. Ohne Lieferungen\
      \ an Binnen- und Küstenmotorschiffe und Fischerei, die zum Sektor Verkehr (Endenergieverbrauch)\
      \ zählen.)\n    Bestandsveränderungen, getrennt erfasst nach Bestandsentnahmen\
      \ und -aufstockungen@de"
  OEO_00000198:
