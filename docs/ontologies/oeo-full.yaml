    is_a: OEO_00000263
    class_uri: oeo:OEO_00000186
    description: Gasworks gas is manufactured coal based gas that covers all types
      of gases produced in public utility or private plants, whose main purpose is
      manufacture, transport and distribution of gas. It includes gas produced by
      carbonisation (including gas produced by coke ovens and transferred to gasworks
      gas), by total gasification with or without enrichment with oil products (LPG,
      residual fuel oil, etc.), and by reforming and simple mixing of gases and/or
      air, reported under the rows ‘from other sources’. Under the transformation
      sector identify amounts of gasworks gas transferred to blended natural gas which
      will be distributed and consumed through the natural gas grid.  The production
      of other coal gases (i.e. coke oven gas, blast furnace gas and oxygen steel
      furnace gas) should be reported in the columns concerning such gases, and not
      as production of gasworks gas. The coal gases transferred to gasworks plants
      should then be reported (in their own column) in the transformation sector in
      the gasworks plants row. The total amount of gasworks gas resulting from transfers
      of other coal gases should appear in the production line for gasworks gas.
    title: gasworks gas
