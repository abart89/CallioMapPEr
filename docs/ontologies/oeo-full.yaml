    title: has primary input
    annotations:
      property_type: ObjectProperty
  RO_0040042:
    name: RO_0040042
    comments:
    - 'R homeomorphic-for C expands to: C SubClassOf R only C. Additionally, for any
      class D that is disjoint with C, we can also expand to C DisjointWith R some
      D, D DisjointWith R some C.'
    slot_uri: obo:RO_0040042
    multivalued: true
    description: R is homemorphic for C iff (1) there exists some x,y such that x
      R y, and x and y instantiate C and (2) for all x, if x is an instance of C,
      and there exists some y some such that x R y, then it follows that y is an instance
      of C.
    title: is homeomorphic for
