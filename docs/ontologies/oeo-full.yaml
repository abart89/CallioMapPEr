  BFO_0000062:
    name: BFO_0000062
    is_a: RO_0002086
    slot_uri: obo:BFO_0000062
    multivalued: true
    description: 'x is preceded by y if and only if the time point at which y ends
      is before or equivalent to the time point at which x starts. Formally: x preceded
      by y iff ω(y) <= α(x), where α is a function that maps a process to a start
      point, and ω is a function that maps a process to an end point.'
    title: preceded by
    annotations:
      property_type: ObjectProperty
  BFO_0000063:
    name: BFO_0000063
    is_a: RO_0002222
    slot_uri: obo:BFO_0000063
    multivalued: true
    description: 'x precedes y if and only if the time point at which x ends is before
      or equivalent to the time point at which y starts. Formally: x precedes y iff
      ω(x) <= α(y), where α is a function that maps a process to a start point, and
      ω is a function that maps a process to an end point.'
    title: precedes
    annotations:
      property_type: ObjectProperty
