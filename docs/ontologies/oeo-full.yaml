    title: illuminance unit
  UO_0000116:
    name: UO_0000116
    is_a: UO_1000116
    class_uri: obo:UO_0000116
    description: '"An illuminance unit which is equal to the illuminance produced
      by 1 lumen evenly spread over an area 1 m^[2]." [NIST:NIST]'
    title: lux
  UO_0000117:
    name: UO_0000117
    is_a: UO_0000157
    class_uri: obo:UO_0000117
    description: '"A unit which is a standard measure of the flow of radiant energy."
      [Wikipedia:Wikipedia]'
    title: luminous flux unit
  UO_0000118:
    name: UO_0000118
    is_a: UO_1000118
    class_uri: obo:UO_0000118
    description: '"A luminous flux unit which is equal to the luminous flux emitted
