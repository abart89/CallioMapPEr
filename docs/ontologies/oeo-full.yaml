  RO_0002222:
    name: RO_0002222
    comments:
    - A relation that holds between two occurrents. This is a grouping relation that
      collects together all the Allen relations.
    is_a: topObjectProperty
    slot_uri: obo:RO_0002222
    range: BFO_0000003
    multivalued: true
    description: A relation that holds between two occurrents. This is a grouping
      relation that collects together all the Allen relations.
    title: temporally related to
    annotations:
      property_type: ObjectProperty
  RO_0002223:
    name: RO_0002223
    is_a: topObjectProperty
    slot_uri: obo:RO_0002223
    multivalued: true
    description: inverse of starts with
    title: starts
    annotations:
      property_type: ObjectProperty
  RO_0002224:
    name: RO_0002224
    is_a: topObjectProperty
    slot_uri: obo:RO_0002224
    multivalued: true
    description: 'x starts with y if and only if x has part y and the time point at
      which x starts is equivalent to the time point at which y starts. Formally:
      α(y) = α(x) ∧ ω(y) < ω(x), where α is a function that maps a process to a start
      point, and ω is a function that maps a process to an end point.'
    title: starts with
    annotations:
      property_type: ObjectProperty
  RO_0002229:
    name: RO_0002229
    is_a: topObjectProperty
    slot_uri: obo:RO_0002229
    multivalued: true
    description: inverse of ends with
    title: ends
    annotations:
      property_type: ObjectProperty
  RO_0002230:
    name: RO_0002230
    is_a: topObjectProperty
    slot_uri: obo:RO_0002230
    multivalued: true
    description: 'x ends with y if and only if x has part y and the time point at
      which x ends is equivalent to the time point at which y ends. Formally: α(y)
      > α(x) ∧ ω(y) = ω(x), where α is a function that maps a process to a start point,
      and ω is a function that maps a process to an end point.'
    title: ends with
    annotations:
      property_type: ObjectProperty
  RO_0002233:
    name: RO_0002233
    comments:
    - 'OEO adjustment: The range of this property has been changed from material entity
      to continuant. A subclass \"has physical input\" has been added for material
      entities and energies.'
    is_a: RO_0000057
    slot_uri: obo:RO_0002233
    multivalued: true
    description: 'p has input c iff: p is a process, c is a material entity, c is
      a participant in p, c is present at the start of p, and the state of c is modified
      during p.'
    title: has input
    annotations:
      property_type: ObjectProperty
  RO_0002234:
    name: RO_0002234
    is_a: RO_0000057
    slot_uri: obo:RO_0002234
    multivalued: true
    description: p has output c iff c is a participant in p, c is present at the end
      of p, and c is not present in the same state at the beginning of p.
    title: has output
    annotations:
      property_type: ObjectProperty
  RO_0002314:
    name: RO_0002314
    is_a: RO_0002502
    slot_uri: obo:RO_0002314
    multivalued: true
    description: q characteristic of part of w if and only if there exists some p
      such that q inheres in p and p part of w.
    title: characteristic of part of
    annotations:
      property_type: ObjectProperty
  RO_0002328:
    name: RO_0002328
    is_a: topObjectProperty
    slot_uri: obo:RO_0002328
    multivalued: true
    description: A grouping relationship for any relationship directly involving a
      function, or that holds because of a function of one of the related entities.
    title: functionally related to
    annotations:
      property_type: ObjectProperty
  RO_0002352:
    name: RO_0002352
    is_a: RO_0000056
    mixins:
    - RO_0002328
    slot_uri: obo:RO_0002352
    multivalued: true
    description: inverse of has input
    title: input of
    annotations:
      property_type: ObjectProperty
  RO_0002353:
    name: RO_0002353
    is_a: RO_0000056
    mixins:
