  OEO_00020023:
    name: OEO_00020023
    is_a: OEO_00020017
    class_uri: oeo:OEO_00020023
    description: Top down is an analytical approach where design starts from the system
      as a whole. The system is then divided into smaller sub-applications with more
      details. Each part again goes through the top down approach till the complete
      system is designed with all minute details. Top down approach is also termed
      as breaking the bigger problem into smaller problems and solving them individually
      in a recursive manner. A top down model is based on a decomposition approach.
    title: top down
  OEO_00020024:
    name: OEO_00020024
    is_a: OEO_00020017
    class_uri: oeo:OEO_00020024
    description: Bottom up is an analytical approach where parts of the system are
      defined in details. Once these parts are designed and developed, then these
      parts or components are linked together to prepare a bigger component. This
      approach is repeated until the complete system is built. A bottom up model is
      based on a composition approach.
    title: bottom up
  OEO_00020026:
    name: OEO_00020026
    is_a: OEO_00020017
    class_uri: oeo:OEO_00020026
    description: Hybrid is an analytical approach that combines the top down and the
      bottom up approach. Some parts are based on composition approach while other
      parts are based on decomposition approach.
    title: hybrid
