      the overall reactions of individual redox reactions being separated but connected
      by an external electric circuit and an intervening electrolyte.
    title: electrochemical reaction
  OEO_00140038:
    name: OEO_00140038
    is_a: OEO_00140034
    class_uri: oeo:OEO_00140038
