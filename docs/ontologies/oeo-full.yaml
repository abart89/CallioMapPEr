  BFO_0000054:
    name: BFO_0000054
    comments:
    - 'Paraphrase of elucidation: a relation between a realizable entity and a process,
      where there is some material entity that is bearer of the realizable entity
      and participates in the process, and the realizable entity comes to be realized
      in the course of the process'
    is_a: topObjectProperty
    slot_uri: obo:BFO_0000054
