    name: OEO_00390015
    is_a: OEO_00390035
    class_uri: oeo:OEO_00390015
    description: Wind speed frequency analysis is an action specification that describes
      the process of calculating the frequency of different wind speed intervals over
      a set period giving a wind speed frequency distribution.
    title: wind speed frequency analysis
  OEO_00390016:
    name: OEO_00390016
    is_a: OEO_00390035
    class_uri: oeo:OEO_00390016
    description: Wind variability identification is an action specification that describes
      the process of identifying variations in wind characteristics across temporal
      scales. Wind characteristics include speed, direction, frequency, turbulence,
      and seasonal or diurnal patterns.
    title: wind variability identification
  OEO_00390017:
    name: OEO_00390017
    is_a: OEO_00390035
    class_uri: oeo:OEO_00390017
    description: Wind power density calculation is an action specification that describes
      how wind power density (WPD) is calculated to estimate the theoretical wind
      power potential based on wind speed and air density.
    title: wind power density calculation
  OEO_00390027:
    name: OEO_00390027
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390027
    description: Improve spatial resolution is an action specification that describes
      the process of increasing the spatial resolution of wind data across a region
      to provide finer detail for wind resource assessment. This is done by horizontal
      interpolation.
    title: improve spatial resolution
  OEO_00390028:
    name: OEO_00390028
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390028
    description: Select exclusion criteria is an action specification that describes
      the process of defining physical, environmental, and regulatory criteria that
      exclude areas from wind farm development, along with the application of buffer
      zones.
    title: select exclusion criteria
  OEO_00390029:
    name: OEO_00390029
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390029
    description: Prepare exclusion criteria datasets is an action specification that
      describes the steps involved in obtaining and preparing datasets that represent
      exclusion zones for wind farm development, based on predefined criteria. That
      includes acquiring and processing the data.
    title: prepare exclusion criteria datasets
  OEO_00390030:
    name: OEO_00390030
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390030
    description: Run multi-criteria secision analysis is an action specification that
      describes how a multi-criteria decision analysis (MCDA) method is applied to
      areas where exclusions are not absolute (soft exclusion criteria), allowing
      for weighted decision-making.
    title: run multi-criteria decision analysis
  OEO_00390031:
    name: OEO_00390031
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390031
    description: Determine development area is an action specification that describes
      the identification of potential areas where wind farm development is feasible,
      by iteratively excluding non-available areas based on the processed data and
      exclusion criteria.
    title: determine development area
  OEO_00390032:
    name: OEO_00390032
    is_a: OEO_00390036
    class_uri: oeo:OEO_00390032
    description: Determine geographical potential is an action specification that
      describes the calculation of the total geographical area available for wind
      farm development after applying exclusion criteria and considering spatial constraints.
    title: determine geographical potential
  OEO_00390033:
    name: OEO_00390033
    is_a: IAO_0000005
    class_uri: oeo:OEO_00390033
    description: Determined wind farm area is an object specification that defines
      the goal of a methodology as a state of understanding the available area for
      wind farm development.
    title: determined wind farm area
  OEO_00390034:
    name: OEO_00390034
    is_a: OEO_00020166
    slot_usage:
      BFO_0000051:
        name: BFO_0000051
        required: true
    class_uri: oeo:OEO_00390034
    description: Wind farm area determination method is a methodology with the goal
      of identifying and quantifying the area suitable for wind farm development,
      based on topographical, environmental, and regulatory constraints.
    title: wind farm area determination method
  OEO_00390035:
    name: OEO_00390035
    is_a: IAO_0000007
    class_uri: oeo:OEO_00390035
    description: Action specification for wind characteristics is an action specification
      that deals with wind characteristics. Wind characteristics include speed, direction,
      frequency, turbulence, and seasonal or diurnal patterns.
    title: action specification for wind characteristics
  OEO_00390036:
    name: OEO_00390036
    is_a: IAO_0000007
    class_uri: oeo:OEO_00390036
    description: Action specification for wind farm development area is an action
      specification that deals with available area for wind farm development.
    title: action specification for wind farm development area
  OEO_00390037:
    name: OEO_00390037
    is_a: BFO_0000015
    slot_usage:
      OEO_00390026:
        name: OEO_00390026
        required: true
    class_uri: oeo:OEO_00390037
    description: Wind farm area determination process is a process that follows a
      determination methodology for available area to gain knowledge of the available
      area for wind farm development.
    title: wind farm area determination process
  OEO_00390038:
    name: OEO_00390038
    is_a: IAO_0000007
    class_uri: oeo:OEO_00390038
    description: Action specification for the technical wind potential of the available
      area is an action specification that deals with the technical wind potential
      of the available area.
    title: action specification for the technical wind potential
  OEO_00390039:
    name: OEO_00390039
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390039
    description: Select appropriate turbine types is an action specification that
      describes the process of choosing wind turbine models based on site-specific
      wind characteristics, hub height, and rotor diameter. Wind characteristics include
      speed, direction, frequency, turbulence, and seasonal or diurnal patterns.
    title: select appropriate turbine types
  OEO_00390040:
    name: OEO_00390040
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390040
    description: Place turbines within area is an action specification that describes
      the definition of the spatial arrangement of wind turbines within the designated
      area, ensuring optimal positioning based on site characteristics and layout
      constraints.
    title: place turbines within area
  OEO_00390041:
    name: OEO_00390041
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390041
    description: Account for wake losses is an action specification that describes
      the inclusion of losses due to wind turbine wake effects, which reduce wind
      speed and energy yield behind turbines.
    title: account for wake losses
  OEO_00390042:
    name: OEO_00390042
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390042
    description: Determine annual energy yield is an action specification that describes
      how a turbine's power curve is combined with the wind speed distribution to
      calculate the expected annual energy production.
    title: determine annual energy yield
  OEO_00390043:
    name: OEO_00390043
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390043
    description: Determine capacity factor is an action specification that describes
      the calculation of the capacity factor (CF), which represents the ratio of actual
      energy output to the maximum possible output over a given time period.
    title: determine capacity factor
  OEO_00390044:
    name: OEO_00390044
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390044
    description: Calculate technical potential is an action specification that describes
      how the total energy production capability of the available area is determined,
      factoring in turbine placement, capacity density, and wake losses.
    title: calculate technical potential
  OEO_00390045:
    name: OEO_00390045
    is_a: IAO_0000005
    class_uri: oeo:OEO_00390045
    description: Determined wind potential is an object specification that defines
      the goal of a methodology as a state of understanding the technical wind potential
      of the available area.
    title: determined wind potential
  OEO_00390046:
    name: OEO_00390046
    is_a: OEO_00020166
    slot_usage:
      BFO_0000051:
        name: BFO_0000051
        required: true
    class_uri: oeo:OEO_00390046
    description: Wind potential determination method is a methodology with the goal
      of calculating the technical wind energy potential within the identified suitable
      area, considering turbine technology, placement, and energy yield factors.
    title: wind potential determination method
  OEO_00390047:
    name: OEO_00390047
    is_a: BFO_0000015
    slot_usage:
      OEO_00390026:
        name: OEO_00390026
        required: true
    class_uri: oeo:OEO_00390047
    description: Wind potential determination processa is a process that follows a
      determination methodology for wind potential to gain knowledge of the technical
      wind potential of the available area.
    title: wind potential determination process
  OEO_00390048:
    name: OEO_00390048
    is_a: IAO_0000007
    class_uri: oeo:OEO_00390048
    description: Action specification for techno-economic potential is an action specification
      that deals with techno-economic potential.
    title: action specification for techno-economic potential
  OEO_00390049:
    name: OEO_00390049
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390049
    description: Determine wind turbine lifetime is an action specification that describes
      the process of estimating the operational lifespan of a wind turbine, based
      on design and site-specific conditions.
    title: determine wind turbine lifetime
  OEO_00390050:
    name: OEO_00390050
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390050
    description: Determine capital expenditures is an action specification that describes
      the calculation of capital expenditures (CAPEX) required for the installation
      of wind turbines and associated infrastructure.
    title: determine capital expenditures
  OEO_00390051:
    name: OEO_00390051
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390051
    description: Determine operational expenditures is an action specification that
      describes the estimation of ongoing operational expenditures (OPEX) for wind
      turbines, including routine maintenance and operational management. These include
      operating and maintenance costs.
    title: determine operational expenditures
  OEO_00390052:
    name: OEO_00390052
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390052
    description: Determine discount and interest rate is an action specification that
      describes the selection of financial discount and interest rates, which are
      used in the economic analysis to account for the time value of money.
    title: determine discount and interest rate
  OEO_00390053:
    name: OEO_00390053
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390053
    description: Calculate levelised cost of electricity is an action specification
      that describes the computation of the levelised cost of electricity (LCOE) either
      for individual turbines or for sub-regions within the study area by applying
      a cost model based on the previously calculated economic parameters and the
      capacity factors.
    title: calculate levelised cost of electricity
  OEO_00390054:
    name: OEO_00390054
    is_a: OEO_00390048
    class_uri: oeo:OEO_00390054
    description: Calculate economic potential is an action specification that describes
      the determination of the total economic potential of the available area under
      a maximum threshold LCOE value.
    title: calculate economic potential
  OEO_00390055:
    name: OEO_00390055
    is_a: IAO_0000005
    class_uri: oeo:OEO_00390055
    description: Determined techno-economic potential is an object specification that
      defines the goal of a methodology as a state of understanding the techno-economic
      potential of the available region.
    title: determined techno-economic potential
  OEO_00390056:
    name: OEO_00390056
    is_a: OEO_00020166
    slot_usage:
      BFO_0000051:
        name: BFO_0000051
        required: true
    class_uri: oeo:OEO_00390056
    description: Techno-economic potential determination method is a methodology with
      the goal of assessing the economic viability of wind energy projects within
      the available area, based on the technical potential and incorporating cost
      factors and economic metrics.
    title: techno-economic potential determination method
  OEO_00390057:
    name: OEO_00390057
    is_a: BFO_0000015
    slot_usage:
      OEO_00390026:
        name: OEO_00390026
        required: true
    class_uri: oeo:OEO_00390057
    description: Techno-economic potential determination process is a process that
      follows a determination methodology for techno-economic potental to gain knowledge
      of the techno-economic potential of the available region.
    title: techno-economic potential determination process
  OEO_00390058:
    name: OEO_00390058
    is_a: IAO_0000007
    class_uri: oeo:OEO_00390058
    description: Action specification for the feasible potential is an action specification
      that deals with the feasible potential of something.
    title: action specification for the feasible potential
  OEO_00390059:
    name: OEO_00390059
    is_a: OEO_00390058
    class_uri: oeo:OEO_00390059
    description: Apply constraints for assessment of potential is an action specification
      that describes the process of integrating non-technical factors, such as social
      acceptance, land use regulations, or market conditions, into the potential assessment.
    title: apply constraints for assessment of potential
  OEO_00390060:
    name: OEO_00390060
    is_a: OEO_00390058
    class_uri: oeo:OEO_00390060
    description: Calculate feasible potential is an action specification that describes
      the calculation of the feasible wind energy potential, considering both technical
      and socio-economic constraints.
    title: calculate feasible potential
  OEO_00390061:
    name: OEO_00390061
    is_a: IAO_0000005
    class_uri: oeo:OEO_00390061
    description: Determined feasible potential is an object specification that defines
      the goal of a methodology as a state of understanding the feasible potential
      of something.
    title: determined feasible potential
  OEO_00390062:
    name: OEO_00390062
    is_a: OEO_00020166
    slot_usage:
      BFO_0000051:
        name: BFO_0000051
        required: true
    class_uri: oeo:OEO_00390062
    description: Feasible potental determination method is a methodology with the
      goal of calculating the wind energy potential that remains after applying additional
      social, regulatory, or market constraints to the available region.
    title: feasible potental determination method
  OEO_00390063:
    name: OEO_00390063
    is_a: BFO_0000015
    slot_usage:
      OEO_00390026:
        name: OEO_00390026
        required: true
    class_uri: oeo:OEO_00390063
    description: Feasible potential determination process al is a process that follows
      a determination methodology for feasable potential to gain knowledge of the
      feasible potential of something.
    title: feasible potental determination process
  OEO_00390064:
    name: OEO_00390064
    is_a: OEO_00000119
    class_uri: oeo:OEO_00390064
    description: A study descriptor is a data descriptor that allows the annotation
      of study information within a scenario bundle by means of keywords from ontological
      terminology.
    title: study descriptor
  OEO_00390066:
    name: OEO_00390066
    is_a: OEO_00390038
    class_uri: oeo:OEO_00390066
    description: Determine capacity density is an action specification that describes
      the calculation of the installed capacity per unit area (MW per km²) by assessing
      the number and power rating of turbines within the available space.
    title: determine capacity density
  OEO_00400012:
    name: OEO_00400012
    comments:
    - 'Uncertainty of a model is a situation of inadequate information, which can
      be of three sorts: inexactness, unreliability, and border with ignorance.'
    is_a: BFO_0000019
    slots:
    - OEO_00400037
    - OEO_00400038
    - OEO_00400039
    slot_usage:
      OEO_00400037:
        name: OEO_00400037
        required: true
      OEO_00400038:
        name: OEO_00400038
        required: true
    class_uri: oeo:OEO_00400012
    description: Uncertainty of a model is a qualtity of a model that represents any
      departure from the unachievable ideal of complete determinism.
    title: uncertainty of a model
  OEO_00400013:
    name: OEO_00400013
    is_a: BFO_0000019
    class_uri: oeo:OEO_00400013
    description: Nature of model uncertainty is a quality of a model that represents
      the core reason for uncertainty within it.
    title: nature of model uncertainty
  OEO_00400017:
    name: OEO_00400017
    is_a: BFO_0000019
    class_uri: oeo:OEO_00400017
    description: Level of model uncertainty is a quality of a model that represents
      the degree or severity of an uncertainty.
    title: level of model uncertainty
  OEO_00400022:
    name: OEO_00400022
    is_a: BFO_0000023
    class_uri: oeo:OEO_00400022
    description: Location of model uncertainty role is a role of an entity in which
      a model uncertainty is located in.
    title: location of model uncertainty role
  OEO_00400041:
    name: OEO_00400041
    is_a: BFO_0000031
    slot_usage:
      BFO_0000050:
        name: BFO_0000050
        required: true
    class_uri: oeo:OEO_00400041
    description: A model system boundary is a generically dependent continuant that
      is part of a model and separates aspects of the real world included in the model
      from those that are not.
    title: model system boundary
  OEO_00400042:
    name: OEO_00400042
    is_a: BFO_0000031
    class_uri: oeo:OEO_00400042
    description: A technical model implementation is a generically dependent continuant
      that is part of a model and consists of the hardware and software realization
      of a (conceptual) model.
    title: technical model implementation
  RO_0002577:
    name: RO_0002577
    is_a: BFO_0000040
    class_uri: obo:RO_0002577
    description: A material entity consisting of multiple components that are causally
      integrated.
    title: system
  UO_0000000:
    name: UO_0000000
    slots:
    - OEO_00010472
    - OEO_00010473
    - OEO_00010474
    - OEO_00010475
    - OEO_00010476
    - OEO_00010477
    - OEO_00010478
    - OEO_00010479
    - OEO_00020404
    - is_unit_of
    class_uri: obo:UO_0000000
    description: '"A unit of measurement is a standardized quantity of a physical
      quality." [Wikipedia:Wikipedia]'
    title: unit
  UO_0000001:
    name: UO_0000001
    is_a: UO_0000000
    class_uri: obo:UO_0000001
    description: '"A unit which is a standard measure of the distance between two
      points." [Wikipedia:Wikipedia]'
    title: length unit
  UO_0000002:
    name: UO_0000002
    is_a: UO_0000000
    class_uri: obo:UO_0000002
    description: '"A unit which is a standard measure of the amount of matter/energy
      of a physical object." [Wikipedia:Wikipedia]'
    title: mass unit
  UO_0000003:
    name: UO_0000003
    is_a: UO_0000000
    class_uri: obo:UO_0000003
    description: '"A unit which is a standard measure of the dimension in which events
      occur in sequence." [Wikipedia:Wikipedia]'
    title: time unit
  UO_0000004:
    name: UO_0000004
    is_a: UO_0000000
    class_uri: obo:UO_0000004
    description: '"A unit which is a standard measure of the flow of electric charge."
      [Wikipedia:Wikipedia]'
    title: electric current unit
  UO_0000005:
    name: UO_0000005
    is_a: UO_0000000
    class_uri: obo:UO_0000005
    description: '"A unit which is a standard measure of the average kinetic energy
      of the particles in a sample of matter." [Wikipedia:Wikipedia]'
    title: temperature unit
  UO_0000007:
    name: UO_0000007
    is_a: UO_0000157
    class_uri: obo:UO_0000007
    description: '"A unit which is a standard measure of the wavelength-weighted power
      emitted by a light source in a particular direction." [Wikipedia:Wikipedia]'
    title: luminous intensity unit
  UO_0000008:
    name: UO_0000008
    is_a: UO_1000008
    mixins:
    - UO_0000045
    class_uri: obo:UO_0000008
    description: '"A length unit which is equal to the length of the path traveled
      by light in vacuum during a time interval of 1/299 792 458 of a second." [BIPM:BIPM,
      NIST:NIST]'
    title: meter
  UO_0000009:
    name: UO_0000009
    is_a: UO_1000021
    mixins:
    - UO_0000045
    class_uri: obo:UO_0000009
    description: '"A mass unit which is equal to the mass of the International Prototype
      Kilogram kept by the BIPM at Svres, France." [BIPM:BIPM, NIST:NIST]'
    title: kilogram
  UO_0000010:
    name: UO_0000010
    is_a: UO_0000045
    mixins:
    - UO_1000010
    class_uri: obo:UO_0000010
    description: '"A time unit which is equal to the duration of 9 192 631 770 periods
      of the radiation corresponding to the transition between the two hyperfine levels
      of the ground state of the caesium 133 atom." [BIPM:BIPM, NIST:NIST]'
    title: second
  UO_0000011:
    name: UO_0000011
    is_a: UO_1000011
    mixins:
    - UO_0000045
    class_uri: obo:UO_0000011
    description: '"An electric current unit which is equal to the constant current
      which, if maintained in two straight parallel conductors of infinite length,
      of negligible circular cross-section, and placed 1 m apart in vacuum, would
      produce between these conductors a force equal to 2 x 10^[-7] newton per meter
      of length." [BIPM:BIPM, NIST:NIST]'
    title: ampere
  UO_0000012:
    name: UO_0000012
    is_a: UO_1000012
    mixins:
    - UO_0000045
    class_uri: obo:UO_0000012
    description: '"A thermodynamic temperature unit which is equal to the fraction
      1/273.16 of the thermodynamic temperature of the triple point of water." [BIPM:BIPM,
      NIST:NIST]'
    title: kelvin
  UO_0000014:
    name: UO_0000014
    is_a: UO_1000014
    mixins:
    - UO_0000045
    class_uri: obo:UO_0000014
    description: '"A luminous intensity unit which equal to the luminous intensity,
      in a given direction, of a source that emits monochromatic radiation of frequency
      540 x 1012 hertz and that has a radiant intensity in that direction of 1/683
      watt per steradian." [BIPM:BIPM, NIST:NIST]'
    title: candela
  UO_0000016:
    name: UO_0000016
    is_a: UO_1000008
    class_uri: obo:UO_0000016
    description: '"A length unit which is equal to one thousandth of a meter or 10^[-3]
      m." [NIST:NIST]'
    title: millimeter
  UO_0000021:
    name: UO_0000021
    is_a: UO_1000021
    class_uri: obo:UO_0000021
    description: '"A mass unit which is equal to one thousandth of a kilogram or 10^[-3]
      kg." [NIST:NIST]'
    title: gram
  UO_0000027:
    name: UO_0000027
    is_a: UO_1000027
    class_uri: obo:UO_0000027
    description: '"A temperature unit which is equal to one kelvin degree. However,
      they have their zeros at different points. The centigrade scale has its zero
      at 273.15 K." [NIST:NIST]'
    title: degree Celsius
  UO_0000031:
    name: UO_0000031
    is_a: UO_1000031
    class_uri: obo:UO_0000031
    description: '"A time unit which is equal to 60 seconds." [Wikipedia:Wikipedia]'
    title: minute
  UO_0000032:
    name: UO_0000032
    is_a: UO_1000032
    class_uri: obo:UO_0000032
    description: '"A time unit which is equal to 3600 seconds or 60 minutes." [Wikipedia:Wikipedia]'
    title: hour
  UO_0000033:
    name: UO_0000033
    is_a: UO_1000033
    class_uri: obo:UO_0000033
    description: '"A time unit which is equal to 24 hours." [Wikipedia:Wikipedia]'
    title: day
  UO_0000034:
    name: UO_0000034
    is_a: UO_1000034
    class_uri: obo:UO_0000034
    description: '"A time unit which is equal to 7 days." [Wikipedia:Wikipedia]'
    title: week
  UO_0000035:
    name: UO_0000035
    is_a: UO_1000035
    class_uri: obo:UO_0000035
    description: '"A time unit which is approximately equal to the length of time
      of one of cycle of the moon''s phases which in science is taken to be equal
      to 30 days." [Wikipedia:Wikipedia]'
    title: month
  UO_0000036:
    name: UO_0000036
    is_a: UO_1000036
    class_uri: obo:UO_0000036
    description: '"A time unit which is equal to 12 months which in science is taken
      to be equal to 365.25 days." [Wikipedia:Wikipedia]'
    title: year
  UO_0000045:
    name: UO_0000045
    is_a: UO_0000000
    class_uri: obo:UO_0000045
    description: '"A unit which is one of a particular measure to which all measures
      of that type can be related." [NIST:NIST]'
    title: base unit
  UO_0000046:
    name: UO_0000046
    is_a: IAO_0000030
    class_uri: obo:UO_0000046
    title: prefix
  UO_0000047:
    name: UO_0000047
    is_a: UO_0000000
    class_uri: obo:UO_0000047
    description: '"A unit which is a standard measure of the amount of a 2-dimensional
      flat surface." [UOC:GVG]'
    title: area unit
  UO_0000051:
    name: UO_0000051
    is_a: UO_0000000
    class_uri: obo:UO_0000051
    description: '"A unit which represents a standard measurement of how much of a
      given substance there is mixed with another substance." [UOC:GVG]'
    title: concentration unit
  UO_0000052:
    name: UO_0000052
    is_a: UO_0000182
    class_uri: obo:UO_0000052
    description: '"A density unit which is a standard measure of the mass of a substance
      in a given volume." [UOC:GVG]'
    title: mass density unit
  UO_0000054:
    name: UO_0000054
    is_a: UO_0000182
    class_uri: obo:UO_0000054
    description: '"A density unit which is a standard measure of the mass exerting
      an influence on a given area." [Wikipedia:Wikipedia]'
    title: area density unit
  UO_0000058:
    name: UO_0000058
    is_a: UO_0000105
    class_uri: obo:UO_0000058
    description: '"A unit which is a standard measure of the number of rotations in
      a given time." [NIST:NIST]'
    title: rotational frequency unit
  UO_0000060:
    name: UO_0000060
    is_a: UO_0000000
    class_uri: obo:UO_0000060
    description: '"A unit which is a standard measure of the rate of movement. Speed
      is measured in the same physical units of measurement as velocity, but does
      not contain the element of direction that velocity has. Speed is thus the magnitude
      component of velocity." [Wikipedia:Wikipedia]'
    title: speed/velocity unit
  UO_0000080:
    name: UO_0000080
    is_a: UO_1000080
    class_uri: obo:UO_0000080
    description: '"An area unit which is equal to an area enclosed by a square with
      sides each 1 meter long." [NIST:NIST]'
    title: square meter
  UO_0000082:
    name: UO_0000082
    is_a: UO_1000082
    class_uri: obo:UO_0000082
    description: '"An area unit which is equal to one millionth of a square meter
      or 10^[-6] m^[2]." [NIST:NIST]'
    title: square millimeter
  UO_0000083:
    name: UO_0000083
    is_a: UO_0000052
    class_uri: obo:UO_0000083
    description: '"A mass unit density which is equal to mass of an object in kilograms
      divided by the volume in cubic meters." [UOC:GVG]'
    title: kilogram per cubic meter
  UO_0000086:
    name: UO_0000086
    is_a: UO_1010049
    class_uri: obo:UO_0000086
    description: '"An area density unit which is equal to the mass of an object in
      kilograms divided by the surface area in meters squared." [NIST:NIST]'
    title: kilogram per square meter
  UO_0000092:
    name: UO_0000092
    is_a: UO_1000092
    class_uri: obo:UO_0000092
    description: '"A rotational frequency unit which is equal to the number complete
      turn in a period of time that equals to 1 second." [NIST:NIST]'
    title: turns per second
  UO_0000094:
    name: UO_0000094
    is_a: UO_1000094
    class_uri: obo:UO_0000094
    description: '"A speed/velocity unit which is equal to the speed of an object
      traveling 1 meter distance in one second." [NIST:NIST]'
    title: meter per second
  UO_0000095:
    name: UO_0000095
    is_a: UO_0000000
    class_uri: obo:UO_0000095
    description: '"A unit which is a standard measure of the amount of space occupied
      by any substance, whether solid, liquid, or gas." [NIST:NIST]'
    title: volume unit
  UO_0000096:
    name: UO_0000096
    is_a: UO_1000096
    class_uri: obo:UO_0000096
    description: '"A volume unit which is equal to the volume of a cube with edges
      one meter in length. One cubic meter equals to 1000 liters." [NIST:NIST]'
    title: cubic meter
  UO_0000097:
    name: UO_0000097
    is_a: UO_1000097
    class_uri: obo:UO_0000097
    description: '"A volume unit which is equal to one millionth of a cubic meter
      or 10^[-9] m^[3], or to 1 ml." [NIST:NIST]'
    title: cubic centimeter
  UO_0000099:
    name: UO_0000099
    is_a: UO_1000099
    class_uri: obo:UO_0000099
    description: '"A volume unit which is equal to one thousandth of a cubic meter
      or 10^[-3] m^[3], or to 1 decimeter." [NIST:NIST]'
    title: liter
  UO_0000105:
    name: UO_0000105
    is_a: UO_0000000
    class_uri: obo:UO_0000105
    description: '"A unit which is a standard measure of the number of repetitive
      actions in a particular time." [NIST:NIST]'
    title: frequency unit
  UO_0000106:
    name: UO_0000106
    is_a: UO_1000106
    class_uri: obo:UO_0000106
    description: '"A frequency unit which is equal to 1 complete cycle of a recurring
      phenomenon in 1 second." [NIST:NIST]'
    title: hertz
  UO_0000107:
    name: UO_0000107
    is_a: UO_0000000
    class_uri: obo:UO_0000107
    description: '"A unit which is a standard measure of the force is applied when
      a mass is accelerated." [NIST:NIST]'
    title: force unit
  UO_0000108:
    name: UO_0000108
    is_a: UO_1000108
    class_uri: obo:UO_0000108
    description: '"A force unit which is equal to the force required to cause an acceleration
      of 1m/s2 of a mass of 1 Kg in the direction of the force." [NIST:NIST]'
    title: newton
  UO_0000109:
    name: UO_0000109
    is_a: UO_0000000
    class_uri: obo:UO_0000109
    description: '"A unit which is a standard measure of the force applied to a given
      area." [NIST:NIST]'
    title: pressure unit
  UO_0000110:
    name: UO_0000110
    is_a: UO_1000110
    class_uri: obo:UO_0000110
    description: '"A pressure unit which is equal to the pressure or stress on a surface
      caused by a force of 1 newton spread over a surface of 1 m^[2]." [NIST:NIST]'
    title: pascal
  UO_0000111:
    name: UO_0000111
    is_a: UO_0000000
    class_uri: obo:UO_0000111
    description: '"A unit which is a standard measure of the work done by a certain
      force (gravitational, electric, magnetic, force of inertia, etc)." [NIST:NIST]'
    title: energy unit
  UO_0000112:
    name: UO_0000112
    is_a: UO_1000112
    class_uri: obo:UO_0000112
    description: '"An energy unit which is equal to the energy required when a force
      of 1 newton moves an object 1 meter in the direction of the force." [NIST:NIST]'
    title: joule
  UO_0000113:
    name: UO_0000113
    is_a: UO_0000000
    class_uri: obo:UO_0000113
    description: '"A unit which is a standard measure power or the rate of doing work."
      [NIST:NIST]'
    title: power unit
  UO_0000114:
    name: UO_0000114
    is_a: UO_1000114
    class_uri: obo:UO_0000114
    description: '"A power unit which is equal to the power used when work is done
      at the rate of 1 joule per second." [NIST:NIST]'
    title: watt
  UO_0000115:
    name: UO_0000115
    is_a: UO_0000157
    class_uri: obo:UO_0000115
    description: '"A unit which is a standard measure of the luminous flux incident
