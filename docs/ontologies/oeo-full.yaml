    slot_uri: obo:RO_0002353
    multivalued: true
    description: inverse of has output
    title: output of
    annotations:
      property_type: ObjectProperty
  RO_0002410:
    name: RO_0002410
    is_a: topObjectProperty
    slot_uri: obo:RO_0002410
    multivalued: true
    description: relation that links two events, processes, states, or objects such
      that one event, process, state, or object (a cause) contributes to the production
      of another event, process, state, or object (an effect) where the cause is partly
      or wholly responsible for the effect, and the effect is partly or wholly dependent
      on the cause.
    title: causally related to
    annotations:
      property_type: ObjectProperty
  RO_0002418:
    name: RO_0002418
    is_a: RO_0002501
    slot_uri: obo:RO_0002418
    multivalued: true
    description: p is 'causally upstream or within' q iff p is causally related to
      q, and the end of p precedes, or is coincident with, the end of q.
    title: causally upstream of or within
    annotations:
      property_type: ObjectProperty
  RO_0002427:
    name: RO_0002427
    is_a: RO_0002501
    slot_uri: obo:RO_0002427
    multivalued: true
    description: inverse of causally upstream of or within
    title: causally downstream of or within
    annotations:
      property_type: ObjectProperty
  RO_0002501:
    name: RO_0002501
    is_a: RO_0002410
    slot_uri: obo:RO_0002501
    range: BFO_0000015
    multivalued: true
    description: p is causally related to q if and only if p or any part of p and
      q or any part of q are linked by a chain of events where each event pair is
      one where the execution of p influences the execution of q. p may be upstream,
      downstream, part of, or a container of q.
    title: causal relation between processes
    annotations:
      property_type: ObjectProperty
  RO_0002502:
    name: RO_0002502
    is_a: topObjectProperty
    slot_uri: obo:RO_0002502
    multivalued: true
    title: depends on
    annotations:
      property_type: ObjectProperty
  RO_0002505:
    name: RO_0002505
    is_a: RO_0000057
    slot_uri: obo:RO_0002505
    multivalued: true
    description: p has intermediate c if and only if p has parts p1, p2 and p1 has
      output c, and p2 has input c
    title: has intermediate
    annotations:
      property_type: ObjectProperty
  RO_0002615:
    name: RO_0002615
    is_a: topObjectProperty
    slot_uri: obo:RO_0002615
    multivalued: true
    description: Inverse of is-model-of
    title: has model
    annotations:
      property_type: ObjectProperty
  RO_0003000:
    name: RO_0003000
    comments:
    - Note that this definition doesn't quite distinguish the output of a transformation
      process from a production process, which is related to the identity/granularity
      issue.
    is_a: topObjectProperty
    slot_uri: obo:RO_0003000
    multivalued: true
    description: 'a produces b if some process that occurs_in a has_output b, where
      a and b are material entities. Examples: hybridoma cell line produces monoclonal
      antibody reagent; chondroblast produces avascular GAG-rich matrix.'
    title: produces
    annotations:
      property_type: ObjectProperty
  RO_0003001:
    name: RO_0003001
    is_a: topObjectProperty
    slot_uri: obo:RO_0003001
    multivalued: true
    description: a produced_by b iff some process that occurs_in b has_output a.
    title: produced by
    annotations:
      property_type: ObjectProperty
  RO_0003301:
    name: RO_0003301
    comments:
    - The primary use case for this relation was to link a biological model system
      such as a cell line or model organism to a disease it is used to investigate,
      in virtue of the model system exhibiting features similar to that of the disease
      of interest. But the relation is defined more broadly to support other use cases,
      such as linking genes in which alterations are made to create model systems
      to the condition the system is used to interrogate, or computational models
      to real-world phenomena they are defined to simulate.
    is_a: topObjectProperty
    slot_uri: obo:RO_0003301
    multivalued: true
    description: A relation between a biological, experimental, or computational artifact
      and an entity it is used to study, in virtue of its replicating or approximating
      features of the studied entity.
    title: has role in modeling
    annotations:
      property_type: ObjectProperty
  RO_0004007:
    name: RO_0004007
    is_a: RO_0000057
    slot_uri: obo:RO_0004007
    multivalued: true
    description: p 'has primary input ot output' c iff either (a) p 'has primary input'
      c or (b) p 'has primary output' c.
    title: has primary input or output
    annotations:
      property_type: ObjectProperty
  RO_0004008:
    name: RO_0004008
    is_a: RO_0004007
    mixins:
    - RO_0002234
    slot_uri: obo:RO_0004008
    multivalued: true
    description: p has primary output c if (a) p has output c and (b) the goal of
      process is to modify, produce, or transform c.
    title: has primary output
    annotations:
      property_type: ObjectProperty
  RO_0004009:
    name: RO_0004009
    is_a: RO_0004007
    mixins:
    - RO_0002233
    slot_uri: obo:RO_0004009
    multivalued: true
    description: p has primary input c if (a) p has input c and (b) the goal of process
