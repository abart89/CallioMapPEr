    is_a: OEO_00140056
    class_uri: oeo:OEO_00140057
    description: A theoretical flow potential is a type of flow potential that identifies
      the physical upper limit of an input or output of a process in a spatial region
      of reference per unit time.
    title: theoretical flow potential
  OEO_00140058:
    name: OEO_00140058
    is_a: OEO_00140056
    class_uri: oeo:OEO_00140058
    description: A technological flow potential is a type of a flow potential derived
      from a theoretical flow potential, taking account of the annual efficiency of
      the respective conversion technology and the additional restrictions regarding
      the area that is realistically available for energy generation.
    title: technological flow potential
  OEO_00140059:
    name: OEO_00140059
    is_a: OEO_00140056
    class_uri: oeo:OEO_00140059
    description: An economic flow potential is a type of flow potential that identifies
      the proportion of the technological potential that can be utilised economically
      (based on economic boundary conditions).
    title: economic flow potential
  OEO_00140060:
    name: OEO_00140060
    is_a: OEO_00140056
    class_uri: oeo:OEO_00140060
    description: A developable flow potential is a type of flow potential that describes
      the fraction of the economic potential that can be developed under realistic
      conditions (regulations, environmental and social restrictions).
    title: developable flow potential
  OEO_00140061:
    name: OEO_00140061
    is_a: OEO_00140056
    class_uri: oeo:OEO_00140061
    description: A sustainable flow potential is a type of flow potential that takes
      into account all aspects of sustainability, which usually requires careful consideration
      and evaluation of different ecological and socio-economic aspects. The differentiation
      of the sustainable potential is blurred, since ecological aspects may already
      have been considered for the technological or economic potential, depending
      on the author.
    title: sustainable flow potential
